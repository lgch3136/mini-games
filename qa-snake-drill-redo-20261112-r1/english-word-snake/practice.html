</style><main><h1>逐格路线练习</h1><p>每按一次方向键，走一格。松手后不自动前进，按 A → R → C 取字。</p><p><strong>练习模式，不记成绩或星星。</strong> 使用 ARC 原盘身关与碰撞规则；思考时计时、保护和连击都停住。</p><p><a href="relay.html">三图无伤接力：60步内连续收齐三组 ARC</a>（新候选，待实玩）</p><canvas id="board" aria-label="ARC 练习场地，蛇与当前目标可在格线中观察"></canvas><p id="metrics"></p><p id="status" role="status" aria-live="polite"></p><div class="pad" aria-label="每次点击走一格"><button data-direction="3" aria-label="向上一步">↑</button><button data-direction="2" aria-label="向左一步">←</button><button data-direction="1" aria-label="向下一步">↓</button><button data-direction="0" aria-label="向右一步">→</button></div><div class="bar"><button id="reset">重开同图</button><a href="index.html">返回原实时模式</a><label><input id="grid" type="checkbox" checked>显示格线</label></div><details><summary>练习规则与键盘操作</summary><p>方向键或 WASD：单步；长按不连走。同方向继续，反方向不会直接掉头。护栏仍可能扣心并自动沿边转向，身体仍会造成碰撞。每一步推进原游戏 0.2 秒；不推荐或替你选择安全路线。练完可回原实时模式检验节奏。</p><p>本页无音频，不保存记录。结束后重开同图可比较紧接着的上一局；中途重开、离开本页或刷新会清空比较。</p></details><section id="recap" hidden></section></main><script type="module" src="./practice-app.mjs?v=20261112-drill-redo-r1"></script></html>
