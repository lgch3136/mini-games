<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>键旅当页路线情报 r1 · 独立试玩</title><style>body{max-width:48rem;margin:3rem auto;padding:1rem;background:#102b33;color:#edf6ef;font:18px/1.7 system-ui}a{display:inline-block;padding:12px 20px;margin:8px;color:#ffdb91;background:#25444b;border-radius:8px}</style><h1>键旅：当页路线情报 r1</h1><p>独立试玩，未完整验收。设置、错词、成绩、声音与暂存使用独立记录，不读取或迁移正式版及旧 QA 记录。</p><p>冒险完成至少一页且奖励全部领完后的地图可显式暂存并退出。战斗、领奖和练习不存；领取续行后若关闭或崩溃，旧暂存不能再次领取，到下个安全地图可再次暂存。需要浏览器 Web Locks，缺少支持时本功能禁用。</p><p>默认收起的当页路线情报可自选展开；原一击选路、九页与远征规则保留，不预抽后续路线或奖励。实际展开、暂存按钮可达、窄屏与决策收益未验，不计完整优化轮。</p><a href="game/index.html?v=qa-typebound-route-intel-20261104-r1">进入独立试玩</a><a href="../index.html">返回小游戏集锦</a></html>
