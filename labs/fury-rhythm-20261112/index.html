<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>斗魂 · 五拍试炼</title><link rel="stylesheet" href="style.css"><body><main><header><div><small>FURY / COMBAT STUDY 01</small><h1>斗魂 · 五拍试炼</h1><p>看清蓄势，贴近出拳，留一步闪避。</p></div><span class="tag">独立战斗样板 · 未并入正式版</span></header><section class="stage"><canvas width="900" height="440" aria-label="斗魂战斗场地：使用下方按钮或键盘操作"></canvas><div id="result" role="status" aria-live="polite"></div></section><div class="readout"><strong id="beat">准备就绪</strong><span id="score">轻击 0 · 重击 0 · 闪避 0 · 受击 0</span></div><div class="timeline" aria-label="攻击五拍"><span>01 预备</span><span>02 蓄势</span><span>03 出拳</span><span>04 跟随</span><span>05 收势</span></div><nav aria-label="游戏操作"><button data-axis="-1" aria-label="向左移动">←</button><button data-axis="1" aria-label="向右移动">→</button><button data-action="light">轻拳 <kbd>J</kbd></button><button data-action="heavy">重拳 <kbd>K</kbd></button><button data-action="dodge">后闪 <kbd>空格</kbd></button></nav><footer><button id="pause">暂停</button><button id="reset">重新试炼</button><label><input type="checkbox" id="practice">静止木人</label><label><input type="checkbox" id="sound">音效</label><label><input type="checkbox" id="motion">减弱震动</label></footer><p class="help">A / D 或方向键移动 · J 轻拳 · K 重拳 · 空格后闪 · P 暂停。收势阶段可用后闪取消，输入最多缓冲 10 帧。红色蓄势圈提示敌方攻击。</p></main><script type="module" src="main.mjs"></script></body></html>
