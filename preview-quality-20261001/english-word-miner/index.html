<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语挖金子 · WORD MINER</title>
<link rel="stylesheet" href="style.css?v=20260930-mobile-r2&mobile=20261001-quality3-r3">
<link rel="stylesheet" href="../shared/mobile-quality.css?v=20260930-quality-r2&mobile=20261001-quality3-r2">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="720" height="560"></canvas>

  <div id="hud">
    <div id="stats">
      <div class="chips">
        <span class="chip">⭐ <b id="score">0</b></span>
        <span class="chip">⛏️ 第<b id="level">1</b>关</span>
        <span class="chip">⏱ <b id="timer">60</b></span>
        <span class="chip">🎯 <b id="quota">0/0</b></span>
      </div>
      <div class="chips">
        <button id="mute-btn">声音</button>
        <button id="pause-btn">暂停</button>
      </div>
    </div>
    <div id="word-bar" class="hidden">
      <span id="wb-kind">挖字母</span><span id="wb-word"></span>
      <div id="wb-zh"></div>
    </div>
    <div id="feedback" role="status"></div><div id="contract-status"></div>
    <button id="cast-btn" type="button">发射 / 空钩收回</button>
    <button id="dynamite-btn" type="button" aria-disabled="true">💥 雷管 <b id="dynamites">1</b></button>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <img class="menu-cover" src="../shared/mobile-art/miner-diorama.webp" alt="">

      <h1>英语挖金子<small>WORD MINER</small></h1>
      <p class="sub">摆动抓钩，掐准时机发射！<br>瞄准虚线，点按出钩；再次点按可空钩收回。精准抓取奖励时间，完成合约后购买本次远征持续生效的升级。</p>
      <button class="btn-main" id="start-btn">开始游戏</button>
      <div class="keys">
        <span>空格 发射 · X 引爆放弃</span><span>P 暂停</span><span>M 静音</span><span>📱 触屏点按</span>
      </div>
      <div class="diff-row">
        <button class="difficulty selected" data-difficulty="easy">初级</button>
        <button class="difficulty" data-difficulty="medium">中级</button>
        <button class="difficulty" data-difficulty="hard">高级</button>
      </div>
      <label class="letter-assist"><input id="letter-assist" type="checkbox" checked> 字母引导 <span>关闭后，只看词义回忆拼写</span></label>
      <a class="arcade-menu-home" href="../index.html">← 返回游戏合集</a>
    </div>
  </div>

  <div class="overlay hidden" id="paused">
    <div class="panel">
      <h1 style="font-size:30px;">暂停中</h1>
      <div class="btn-row">
        <button class="btn-main" id="resume-btn" style="padding:10px 34px;font-size:15px;">继续</button>
        <button class="btn-sub" id="pause-menu-btn">回主菜单</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="panel">
      <p id="over-kicker" style="color:#fbbf24;letter-spacing:4px;font-size:12px;margin-bottom:6px;">行动结束</p>
      <h1 id="over-title" style="font-size:32px;color:#fde68a;text-shadow:0 3px 16px rgba(250,204,21,.4);">再来一局？</h1>
      <img id="run-medal" class="mastery-medal" src="../shared/mobile-art/medal-bronze.webp" alt="本局徽章">
      <div id="over-stats"></div>
      <div class="btn-row">
        <button class="btn-main" id="retry-btn" style="padding:11px 38px;font-size:16px;">再来一局</button>
        <button class="btn-sub" id="menu-btn">回主菜单</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="shop">
    <div class="panel shop-panel">
      <p class="shop-kicker">合约完成 · 矿工商店</p>
      <h1>带什么下矿？<small id="shop-summary"></small></h1>
      <div class="shop-grid">
        <button class="shop-buy" data-item="dynamite"><b>💥 雷管 +1</b><span>拉到废石时立即炸掉</span><em>250</em></button>
        <button class="shop-buy" data-item="strength"><b>💪 力量药水</b><span>本次远征重物回收加快 20%</span><em>400</em></button>
        <button class="shop-buy" data-item="luck"><b>💎 幸运草</b><span>本次远征增加深层钻石</span><em>500</em></button>
      </div>
      <button class="btn-main" id="next-level-btn">进入下一关</button>
    </div>
  </div>
</div>

<script src="../shared/vocabulary.js"></script>
<script src="../shared/audio.js?v=20260930-mobile-r2&mobile=20261001-quality3-r1"></script>
<script src="../shared/chip-music.js?v=20260930-mobile-r2&mobile=20261001-quality3-r1"></script>
<script src="../shared/gameplay-art/motion.js?v=20261001&mobile=20261001-quality2-r1"></script>
<script src="../shared/gameplay-art/runtime.js?v=20261001&mobile=20261001-quality2-r1"></script>
<script src="game.js?v=20260930-mobile-r2&mobile=20261001-quality3-r3"></script>
</body>
</html>
