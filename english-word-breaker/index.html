<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语打砖块 · WORD BREAKER</title>
<link rel="stylesheet" href="style.css?v=20260824e">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="720" height="560"></canvas>

  <div id="hud">
    <div id="stats">
      <div class="chips">
        <span class="chip">⭐ <b id="score">0</b></span>
        <span class="chip">🧡 <b id="lives">3</b></span>
        <span class="chip">🏁 第<b id="level">1</b>关</span>
      </div>
      <div class="chips">
        <button id="mute-btn">声音</button>
        <button id="pause-btn">暂停</button>
      </div>
    </div>
    <div id="word-bar" class="hidden">
      <span id="wb-kind">拼单词</span><span id="wb-word"></span>
      <div id="wb-zh"></div>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <img class="menu-cover" src="assets/cover.png" alt="">

      <h1>英语打砖块<small>WORD BREAKER</small></h1>
      <p class="sub">弹球撞碎砖墙，收集砖上字母按顺序拼单词。<br>字母集齐自动过关，挡板角度决定球的去向！</p>
      <div class="keys">
        <span>← → / A D 移动挡板</span><span>空格 发射</span><span>每破 4 块必掉 M/W/S/F 胶囊</span><span>P 暂停</span><span>M 静音</span><span>📱 拖动 + 点击</span>
      </div>
      <div class="diff-row">
        <button class="difficulty selected" data-difficulty="easy">初级</button>
        <button class="difficulty" data-difficulty="medium">中级</button>
        <button class="difficulty" data-difficulty="hard">高级</button>
      </div>
      <button class="btn-main" id="start-btn">开始游戏</button>
    </div>
  </div>

  <div class="overlay hidden" id="paused">
    <div class="panel">
      <h1 style="font-size:30px;">暂停中</h1>
      <div class="btn-row">
        <button class="btn-main" id="resume-btn" style="padding:10px 34px;font-size:15px;">继续</button>
        <button class="btn-sub" id="pause-menu-btn">回主菜单</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="panel">
      <p id="over-kicker" style="color:#7dd3fc;letter-spacing:4px;font-size:12px;margin-bottom:6px;">行动结束</p>
      <h1 id="over-title" style="font-size:32px;color:#e0f2fe;text-shadow:0 3px 16px rgba(80,160,255,.4);">再来一局？</h1>
      <div id="over-stats"></div>
      <div class="btn-row">
        <button class="btn-main" id="retry-btn" style="padding:11px 38px;font-size:16px;">再来一局</button>
        <button class="btn-sub" id="menu-btn">回主菜单</button>
      </div>
    </div>
  </div>
</div>

<script src="../shared/vocabulary.js"></script>
<script src="../shared/audio.js?v=20260819a"></script>
<script src="../shared/chip-music.js?v=4"></script>
<script src="game.js?v=20260901a"></script>
</body>
</html>
