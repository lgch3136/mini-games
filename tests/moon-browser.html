<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Moonblade input QA</title
  ><style>
    body {
      margin: 0;
      background: #0b1724;
      color: #dfd4b7;
      font: 12px system-ui;
    }
    header {
      height: 46px;
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0 10px;
    }
    button {
      padding: 7px 12px;
    }
    iframe {
      border: 0;
      width: 100%;
      height: calc(100dvh - 46px);
      display: block;
    }
    pre {
      display: none;
    }
  </style>
  <header>
    <button id="suite">操作回归</button><button id="route">三章输入试打</button
    ><button id="stop">停止并释放</button
    ><span id="status">仅通过正式 UI 与键盘 / 触屏事件，读取诊断。</span>
  </header>
  <iframe
    id="subject"
    src="../english-moonblade/?qa=1"
    allow="autoplay"
  ></iframe>
  <pre id="report"></pre>
  <script type="module" src="moon-browser.mjs"></script>
</html>
