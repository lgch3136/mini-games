<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile quality review · 15 games</title><style>
*{box-sizing:border-box}body{margin:0;background:#18232f;color:#eff8ff;font:14px system-ui,sans-serif}header{padding:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#0d1722;position:sticky;top:0;z-index:5}select,button{font:inherit;min-height:44px;border:1px solid #698192;background:#223747;color:white;border-radius:8px;padding:8px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #8be2c9}#stage{padding:18px;overflow:auto;display:flex;justify-content:center;align-items:flex-start;min-height:500px}iframe{box-sizing:content-box;background:#05090d;flex:none;border:1px solid #5f7f90;border-radius:14px;box-shadow:0 12px 36px #0008}#note{padding:0 16px;color:#c0d3dd;font-size:12px}#report{display:block;width:calc(100% - 32px);min-height:150px;margin:12px 16px 24px;background:#0c1823;color:#b5e7d5;border:1px solid #38515d;border-radius:10px;padding:12px;white-space:pre-wrap;font:12px/1.5 monospace}
</style></head><body><header><strong>15-game review</strong><label>游戏 <select id="game"></select></label><label>视口 <select id="viewport"><option value="390x844">390 × 844 竖屏</option><option value="844x390">844 × 390 横屏</option><option value="320x568">320 × 568 小屏</option><option value="1180x760">1180 × 760 桌面</option></select></label><button id="load">载入 / 重试</button><button id="next">下一款</button><button id="inspect">检查当前布局</button><button id="unload">释放页面</button></header><p id="note">真实 iframe 视口 / 浏览器绘制。不是 iPhone、触摸硬件、Safari 或 GPU 帧率认证。开始、暂停、重试等操作请在游戏内执行。</p><div id="stage"></div><output id="report" aria-live="polite">选择游戏并载入</output><script type="module">
import {GAME_GUIDE} from '../shared/arcade-catalog.mjs';
const game=document.querySelector('#game'),viewport=document.querySelector('#viewport'),stage=document.querySelector('#stage'),report=document.querySelector('#report');
for(const [id,info] of [['hub',{label:'合集首页'}],...Object.entries(GAME_GUIDE)]){const o=document.createElement('option');o.value=id;o.textContent=info.label;game.append(o);}
const params=new URLSearchParams(location.search);
if(params.get('game')==='hub'||Object.hasOwn(GAME_GUIDE,params.get('game')))game.value=params.get('game');
if([...viewport.options].some(o=>o.value===params.get('size')))viewport.value=params.get('size');
let frame=null;
function load(){if(frame){frame.src='about:blank';frame.remove();}frame=document.createElement('iframe');frame.title='游戏实际页面';const [w,h]=viewport.value.split('x');frame.width=w;frame.height=h;const destination=game.value==='hub'?'../index.html':`../${game.value}/index.html`;const revision=params.get('build');frame.src=revision?destination+'?v='+encodeURIComponent(revision.slice(0,80)):destination;stage.replaceChildren(frame);report.textContent='载入中';frame.addEventListener('load',()=>{report.textContent=`已载入 ${game.options[game.selectedIndex].text} · ${w}×${h}\n请实际操作后检查；仅看到菜单不代表玩法通过。`;},{once:true});}
document.querySelector('#load').addEventListener('click',load);
document.querySelector('#next').addEventListener('click',()=>{game.selectedIndex=(game.selectedIndex+1)%game.options.length;load();});
viewport.addEventListener('change',()=>{if(frame){const [w,h]=viewport.value.split('x');frame.width=w;frame.height=h;}});
document.querySelector('#unload').addEventListener('click',()=>{if(frame){frame.src='about:blank';frame.remove();frame=null;}report.textContent='游戏页面已移除；确认音频停止、再次载入正常。';});
document.querySelector('#inspect').addEventListener('click',()=>{
 if(!frame){report.textContent='尚未载入';return;}
 try{
 const d=frame.contentDocument,w=frame.contentWindow,visible=el=>{const r=el.getBoundingClientRect(),s=w.getComputedStyle(el);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'&&!el.closest('[hidden]');};
 const targets=[...d.querySelectorAll('button,input,select,a,[role="button"]')].filter(visible).map(el=>{const r=el.getBoundingClientRect();return {label:(el.getAttribute('aria-label')||el.textContent||el.id).trim().slice(0,65),width:Math.round(r.width),height:Math.round(r.height),clipped:r.left<-.5||r.right>w.innerWidth+.5||r.top<-.5||r.bottom>w.innerHeight+.5};});
 const small=targets.filter(t=>t.width<44||t.height<44),clipped=targets.filter(t=>t.clipped);
 const data={game:game.value,viewport:{width:w.innerWidth,height:w.innerHeight},horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth+1,visibleTargets:targets.length,under44px:small,clippedTargets:clipped,canvas:[...d.querySelectorAll('canvas')].map(c=>({backing:[c.width,c.height],css:[Math.round(c.getBoundingClientRect().width),Math.round(c.getBoundingClientRect().height)]})),missingImages:[...d.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),note:'44px findings are review candidates, not automatic failure for noninteractive inline links. No real-device claim.'};
 report.textContent=JSON.stringify(data,null,2);
 }catch(e){report.textContent='检查受限：'+e.message;}
});
load();
</script></body></html>
