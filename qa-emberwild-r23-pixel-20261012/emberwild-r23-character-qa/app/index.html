<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>余烬旷野 · R23 固定画面像素诊断</title><link rel="stylesheet" href="../../emberwild-integrated-r19/app/style.css?v=20261007-controls"><link rel="stylesheet" href="../../emberwild-integrated-r19/app/rpg-ui-r13.css?v=20261008-r13"><link rel="stylesheet" href="../../emberwild-integrated-r19/app/spell-feedback-r12.css?v=20261008-r12"><script type="importmap">{"imports":{"three":"../../emberwild-integrated-r19/app/vendor/three.module.min.js"}}</script><link rel="stylesheet" href="../../emberwild-integrated-r19/app/mount-ui-r14.css?v=20261008-r14"></head><body>
<canvas id="world" tabindex="0" aria-label="余烬旷野第三人称探索场景：WASD 移动，左拖观察，右拖转向，双键前进，滚轮缩放，F 挥剑，Shift 闪避，空格跳跃，E 互动，B 背包 · Tab 选择目标不暂停，Esc 先关闭背包，再按暂停"></canvas><div id="vignette"></div>
