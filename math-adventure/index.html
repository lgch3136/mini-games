<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学探险队 · 从看懂到独立做题</title><style>body{margin:0;padding:16px;background:#eaf0e9}body>#math-adventure{max-width:1040px;margin:auto}@media(max-width:600px){body{padding:0}}</style></head><body>
<div id="math-adventure" lang="zh-CN"></div>
<style>
#math-adventure{--ink:#243e43;--muted:#607579;--paper:#fffdf6;--surface:#fff;--green:#207665;--mint:#e4f3e7;--line:#dbe6df;--orange:#f3aa54;--blue:#78bdd7;--pink:#edb2ac;--purple:#b5a6db;color-scheme:light;color:var(--ink);font:17px/1.65 ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);border-radius:24px;overflow:hidden;max-width:100%;text-align:left;box-sizing:border-box}
#math-adventure *{box-sizing:border-box}
#math-adventure button,#math-adventure input{font:inherit}
#math-adventure button{cursor:pointer;touch-action:manipulation}
#math-adventure button:focus-visible,#math-adventure input:focus-visible{outline:3px solid #d27a2b;outline-offset:4px}
#math-adventure button:disabled{cursor:default;opacity:.5}
#math-adventure h1,#math-adventure h2,#math-adventure h3,#math-adventure p{margin:0}
#math-adventure .ma-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;background:var(--mint);flex-wrap:wrap}
#math-adventure .ma-brand{font-size:18px;font-weight:750;letter-spacing:.04em}
#math-adventure .ma-top-actions{display:flex;gap:8px;flex-wrap:wrap}
#math-adventure .ma-link{border:0;background:transparent;color:var(--green);padding:8px 10px;min-height:44px;font-size:14px;border-radius:12px}
#math-adventure .ma-link:hover{background:#d3e9d8}
#math-adventure .ma-main{padding:24px;max-width:900px;margin:auto}
#math-adventure .ma-kicker{font-size:13px;letter-spacing:.09em;color:var(--muted);font-weight:600}
#math-adventure h1{font-size:clamp(24px,4vw,32px);line-height:1.35;font-weight:750;margin:5px 0 16px}
#math-adventure h2{font-size:22px;line-height:1.45;font-weight:700}
#math-adventure .ma-progress{display:flex;gap:5px;margin:0 0 20px}
#math-adventure .ma-dot{height:5px;background:#e2e9e3;border-radius:8px;flex:1}
#math-adventure .ma-dot.on{background:var(--green)}
#math-adventure .ma-guide{display:flex;align-items:center;gap:14px;margin-bottom:20px}
#math-adventure .ma-avatar{font-size:36px;width:60px;flex:0 0 60px;aspect-ratio:1;display:grid;place-items:center;background:#ffebce;border-radius:22px 22px 22px 7px}
#math-adventure .ma-speech{font-size:19px;line-height:1.65;max-width:640px}
#math-adventure .ma-scene{background:#f1f6ef;border-radius:20px;padding:24px 22px;margin:14px 0 20px;min-height:220px;position:relative}
#math-adventure .ma-caption{font-size:14px;color:var(--muted);text-align:center;margin-top:12px}
#math-adventure .ma-question{font-size:20px;font-weight:650;margin:18px 0 12px}
#math-adventure .ma-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#math-adventure .ma-choice{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 12px;min-height:64px;line-height:1.4;color:var(--ink);font-size:18px;font-weight:600;transition:transform .15s,border-color .15s}
#math-adventure .ma-choice:hover:not(:disabled){transform:translateY(-2px);border-color:#8ebbaa}
#math-adventure .ma-choice.right{background:#e0f3df;border-color:var(--green)}
#math-adventure .ma-choice.try{background:#fff3dd;border-color:#dbac62}
#math-adventure .ma-feedback{margin-top:14px;padding:13px 16px;background:#fff0d4;border-radius:14px;color:#69491a;line-height:1.7}
#math-adventure .ma-feedback.success{background:#e1f2df;color:#285e35}
#math-adventure .ma-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
#math-adventure .ma-primary{background:var(--green);color:#fff;border:0;border-radius:15px;min-height:52px;padding:12px 24px;font-weight:650;font-size:18px;box-shadow:0 4px 0 #155247}
#math-adventure .ma-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #155247}
#math-adventure .ma-secondary{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:14px;min-height:48px;padding:9px 17px;font-weight:600}
#math-adventure .ma-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
#math-adventure .ma-statement{background:#fff;border-radius:13px;padding:10px 15px;margin:10px auto;max-width:550px;text-align:center}
#math-adventure .ma-cups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin:24px 0 8px;align-items:end}
#math-adventure .ma-cup{height:108px;border:3px solid #799d98;border-top:0;border-radius:3px 3px 17px 17px;background:#fff;position:relative;overflow:hidden;display:flex;align-items:end;padding:0;color:var(--ink);min-width:0}
#math-adventure .ma-juice{width:100%;height:var(--fill);background:var(--orange);transition:height .35s ease}
#math-adventure .ma-cup-label{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:650;pointer-events:none}
#math-adventure .ma-cup:disabled{opacity:1}
#math-adventure .ma-cup.empty{border-style:dashed;background:transparent}
#math-adventure .ma-bracket{display:grid;grid-template-columns:3fr 5fr;gap:10px;font-size:14px;text-align:center}
#math-adventure .ma-bracket span{border-top:2px solid #7b9994;padding-top:5px}
#math-adventure .ma-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
#math-adventure .ma-row-name{min-width:80px;font-size:16px;font-weight:600}
#math-adventure .ma-items{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-height:48px}
#math-adventure .ma-token{font-size:30px;line-height:1.3;min-width:39px;min-height:44px;display:grid;place-items:center;border:0;background:transparent;padding:2px;position:relative}
#math-adventure .ma-token.add{background:#ffe7b5;border-radius:10px}
#math-adventure .ma-token.faded{opacity:.18;filter:grayscale(1)}
#math-adventure .ma-counter{display:inline-block;background:#fff;padding:5px 12px;border-radius:10px;font-weight:650;margin-left:auto}
#math-adventure .ma-recipe{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:600;font-size:17px}
#math-adventure .ma-supply{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin:18px 0}
#math-adventure .ma-supply .ma-items{gap:2px}
#math-adventure .ma-supply .ma-token{font-size:25px;min-width:30px}
#math-adventure .ma-svg{display:block;width:100%;max-width:620px;margin:auto;touch-action:pan-y}
#math-adventure .ma-svg text{font-family:inherit;fill:var(--ink);font-size:16px}
#math-adventure .ma-svg .ma-small{font-size:13px}
#math-adventure .ma-slider{display:block;width:100%;accent-color:var(--green);margin:16px 0 4px;min-height:36px;cursor:ew-resize}
#math-adventure .ma-range-label{display:block;text-align:center;font-size:14px}
#math-adventure .ma-water{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:500px;margin:12px auto}
#math-adventure .ma-water i{aspect-ratio:1.6;background:#79bdd8;border-radius:3px}
#math-adventure .ma-salt-pieces{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:14px auto}
#math-adventure .ma-salt-piece{height:28px;width:28px;border-radius:6px;background:#f2be62;display:grid;place-items:center;font-size:13px;font-style:normal}
#math-adventure .ma-salt-piece.new{background:#bd9ada}
#math-adventure .ma-track{position:relative;background:#dbe9d9;height:58px;border-radius:14px;margin:8px 22px 26px}
#math-adventure .ma-distance{height:100%;background:#b3d4ad;border-radius:14px;transition:width .6s}
#math-adventure .ma-racer{position:absolute;left:var(--pos);top:4px;transform:translateX(-50%);font-size:34px;transition:left .6s}
#math-adventure .ma-finish{position:absolute;right:-18px;top:7px;font-size:27px}
#math-adventure .ma-road-ticks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(24,1fr);pointer-events:none}
#math-adventure .ma-road-ticks i{border-right:1px solid #5f875526;margin:7px 0}
#math-adventure .ma-days{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin:24px 0}
#math-adventure .ma-day{border:0;border-radius:10px;min-height:66px;background:#fff;display:grid;place-content:center;gap:3px;font-size:18px;color:var(--ink)}
#math-adventure .ma-day.read{background:#cddfc7}
#math-adventure .ma-day.picked{background:#ffdda3}
#math-adventure .ma-day small{font-size:12px}
#math-adventure .ma-books{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:540px;margin:14px auto}
#math-adventure .ma-book{border-radius:8px 14px 14px 8px;border-left:8px solid #527f72;background:#d3e7dd;text-align:center;padding:24px 8px;min-height:130px;font-size:17px;font-weight:600}
#math-adventure .ma-book.rest{background:#f4ddab;border-color:#b98d47}
#math-adventure .ma-book span{font-size:30px;display:block}
#math-adventure .ma-machines{display:grid;gap:10px}
#math-adventure .ma-machine{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:8px;text-align:center}
#math-adventure .ma-machine strong{font-size:20px}
#math-adventure .ma-machine-middle{background:#dbe6dd;border-radius:12px;padding:14px 8px;font-size:15px}
#math-adventure .ma-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:24px}
#math-adventure .ma-island{position:relative;border:2px solid var(--line);border-radius:22px;padding:22px 15px;background:#fff;text-align:left;color:var(--ink);min-height:180px}
#math-adventure .ma-island:hover{border-color:#72a994;transform:translateY(-2px)}
#math-adventure .ma-island-icon{font-size:38px;display:block;margin-bottom:10px}
#math-adventure .ma-island strong{font-size:18px;display:block}
#math-adventure .ma-island small{font-size:14px;color:var(--muted);display:block;margin-top:5px}
#math-adventure .ma-earned{position:absolute;right:12px;top:13px;color:var(--green);font-size:13px}
#math-adventure .ma-win{text-align:center;padding:16px 0}
#math-adventure .ma-sticker{font-size:74px;line-height:1.3;margin:12px}
#math-adventure .ma-win p{max-width:520px;margin:14px auto;font-size:19px}
#math-adventure .ma-adult{font-size:16px;line-height:1.85}
#math-adventure .ma-adult details{background:white;border-radius:12px;padding:14px 16px;margin:12px 0}
#math-adventure .ma-adult summary{cursor:pointer;font-weight:650}
#math-adventure .ma-adult a{color:var(--green);text-decoration:underline}
#math-adventure .ma-adult p{margin:10px 0}
#math-adventure .ma-tag{font-size:13px;padding:4px 9px;border-radius:8px;background:#fff;color:var(--green)}
#math-adventure .ma-foldboard{position:relative;max-width:100%;margin:auto}
#math-adventure .ma-treasure{position:absolute;border:0;background:transparent;color:#266443;border-radius:3px;font-size:22px;padding:0;display:grid;place-items:center;min-width:0;min-height:0}
#math-adventure .ma-treasure:hover{background:#ffffff66}
#math-adventure .ma-foldcell{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:0}
#math-adventure .ma-foldcell:hover{fill:#ffffff55}
#math-adventure .ma-clone{transform-origin:0 0;animation:ma-clone .65s ease-out both}
@keyframes ma-clone{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#math-adventure .ma-main{padding:20px 16px}#math-adventure .ma-top{padding:12px 16px}#math-adventure .ma-scene{padding:20px 12px}#math-adventure .ma-choices{grid-template-columns:1fr}#math-adventure .ma-choice{min-height:52px;padding:11px}#math-adventure .ma-map{grid-template-columns:repeat(2,minmax(0,1fr))}#math-adventure .ma-avatar{width:46px;flex-basis:46px;font-size:30px}#math-adventure .ma-speech{font-size:18px}#math-adventure .ma-cups{gap:5px}#math-adventure .ma-cup{height:85px;border-width:2px}#math-adventure .ma-cup-label{font-size:15px}#math-adventure .ma-supply{grid-template-columns:42px 1fr auto;gap:6px}#math-adventure .ma-supply .ma-counter{font-size:14px;padding:3px 6px}#math-adventure .ma-supply .ma-token{font-size:23px;min-width:25px}#math-adventure .ma-days{gap:3px}#math-adventure .ma-day{min-height:58px;font-size:16px}#math-adventure .ma-day small{font-size:11px}}
@media(prefers-reduced-motion:reduce){#math-adventure *,#math-adventure *::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#math-adventure .ma-route{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px;font-size:13px}
#math-adventure .ma-route span{background:#e8ede6;padding:5px 9px;border-radius:9px;color:#5d7367}
#math-adventure .ma-route span.active{background:#207665;color:#fff}
#math-adventure .ma-exam-intro{color:#607579;margin-bottom:16px}
#math-adventure .ma-paper{background:#fff;border:1px solid #dbe6df;border-radius:18px;padding:22px;margin:18px 0;font-size:20px;line-height:1.85}
#math-adventure .ma-paper .ma-svg{max-width:340px;margin:18px auto 0}
#math-adventure .ma-field{display:grid;gap:7px;margin:16px 0;font-size:17px}
#math-adventure .ma-field span{font-weight:600}
#math-adventure .ma-field input,#math-adventure .ma-field select,#math-adventure .ma-field textarea{width:100%;min-width:0;min-height:50px;border:2px solid #dbe6df;border-radius:12px;padding:10px 13px;color:#243e43;background:white;box-sizing:border-box}
#math-adventure .ma-field input,#math-adventure .ma-field select,#math-adventure .ma-field textarea{font-family:inherit;font-size:18px;line-height:1.5}
#math-adventure .ma-field textarea{resize:vertical}
#math-adventure .ma-answer-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
#math-adventure .ma-notice{font-size:13px;color:#66766c;line-height:1.6}
#math-adventure .ma-repair{background:#fff0d4;border-radius:16px;padding:18px;margin-top:18px}
#math-adventure .ma-repair p{margin-top:8px}
#math-adventure .ma-bridge{display:grid;gap:14px;background:#eef5ec;border-radius:18px;padding:22px;margin:18px 0;text-align:center;font-size:19px}
#math-adventure .ma-bridge>span{font-size:26px;color:#207665}
#math-adventure .ma-checks{display:grid;gap:8px;margin:20px 0}
#math-adventure .ma-checks>div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:white;border-radius:12px;padding:14px 16px}
#math-adventure .ma-checks strong{color:#207665}
#math-adventure .ma-solution{font-size:16px;max-width:550px}
#math-adventure .ma-solution summary{cursor:pointer;color:#207665;padding:10px 0}
#math-adventure .ma-earned{position:static;display:block;margin-top:9px;line-height:1.4}
#math-adventure #ma-exam-form>.ma-primary{margin-top:16px}
#math-adventure .ma-choices{grid-template-columns:1fr}
#math-adventure .ma-choice{text-align:left;font-size:17px;min-height:54px}
#math-adventure .ma-record-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;padding:15px;background:white;border-radius:14px}
@media(max-width:600px){#math-adventure .ma-answer-fields{grid-template-columns:1fr}#math-adventure .ma-paper{padding:16px;font-size:18px}#math-adventure .ma-route{gap:5px;font-size:12px}#math-adventure .ma-route span{padding:4px 6px}}

#math-adventure .picnic-main{max-width:900px;margin:auto}
#math-adventure .picnic-progress{display:flex;justify-content:space-between;gap:12px;color:#667c73;font-size:14px;margin-bottom:14px}
#math-adventure .picnic-story{display:flex;align-items:center;gap:16px;margin:20px 0 24px}
#math-adventure .picnic-story>span{font-size:46px;flex-shrink:0}
#math-adventure .picnic-story p{font-size:22px;line-height:1.75;margin:0}
#math-adventure .picnic-story strong{color:#207665}
#math-adventure .picnic-world{background:#f0f5e9;border-radius:24px;padding:22px;text-align:center}
#math-adventure .picnic-scene-heading{font-weight:700;font-size:20px;margin:0 0 15px;color:#426052}
#math-adventure .picnic-eight{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;max-width:none;margin:auto}
#math-adventure .picnic-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:540px;margin:auto}
#math-adventure .picnic-card{min-width:0;text-align:center}
#math-adventure .picnic-bag-static,#math-adventure .picnic-bag-button{display:flex;flex-direction:column;align-items:center;padding:4px 4px 8px;background:transparent;border:2px solid transparent;border-radius:16px;width:100%;box-sizing:border-box;color:#243e43;font-family:inherit}
#math-adventure .picnic-bag-button{cursor:pointer;background:#fffdf5;border-color:#c3cdb7;transition:background .15s,transform .15s}
#math-adventure .picnic-bag-button:not(:disabled):hover{background:#fff4cf;border-color:#8b9c6c;transform:translateY(-2px)}
#math-adventure .picnic-bag-button:disabled{cursor:default;opacity:1}
#math-adventure .picnic-bag-button:focus-visible,#math-adventure .picnic-take:focus-visible{outline:3px solid #207665;outline-offset:3px}
#math-adventure .picnic-pal{font-size:30px;line-height:1.15;min-height:4px}
#math-adventure .picnic-bag-svg{display:block;width:100%;max-width:112px;height:auto;margin:-2px auto 0}
#math-adventure .picnic-three .picnic-bag-svg{max-width:150px}
#math-adventure .picnic-card-label{font-size:16px;line-height:1.5;color:#667668}
#math-adventure .picnic-card-count{font-size:19px;font-weight:700;line-height:1.5}
#math-adventure .picnic-take{background:#fff;border:1px solid #cbd6c5;border-radius:9px;padding:8px 12px;font:inherit;font-size:15px;cursor:pointer;margin-top:9px;min-height:40px;color:#526758}
#math-adventure .picnic-take:disabled{opacity:.4;cursor:default}
#math-adventure .picnic-scene-note{font-size:18px;margin:16px 0 0;font-weight:600}
#math-adventure .picnic-basket{max-width:420px;margin:0 auto 16px;padding:12px;background:#fffdf5;border-radius:14px;border-bottom:5px solid #ddbd83}
#math-adventure .picnic-basket strong{font-size:18px}
#math-adventure .picnic-loose{display:flex;justify-content:center;gap:4px;margin-top:7px}
#math-adventure .picnic-loose svg{width:40px;max-width:14%;height:44px}
#math-adventure .picnic-empty-orange{opacity:.13}
#math-adventure .picnic-instruction{font-size:19px;color:#47604c;margin:0 0 18px;font-weight:600}
#math-adventure .picnic-check{margin-top:16px;text-align:center}
#math-adventure .picnic-total{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:21px}
#math-adventure #picnic-answer{width:90px;min-width:0;min-height:52px;font:inherit;text-align:center;border:2px solid #c4d4c4;border-radius:10px;background:#fff;color:#243e43;padding:8px;box-sizing:border-box}
#math-adventure .picnic-equations{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding-top:18px;font-size:18px;color:#207665}
#math-adventure .picnic-fraction-view .picnic-card{border-bottom:4px solid #b9cdb6;border-radius:12px}
#math-adventure .picnic-fraction-view .picnic-known{background:#fff0d6;border-bottom-color:#db9c34}
#math-adventure .picnic-legend{display:flex;justify-content:center;gap:12px 22px;flex-wrap:wrap;margin:20px 0 15px;font-size:16px}
#math-adventure .picnic-legend span:first-child{color:#9d641f}
#math-adventure .picnic-fraction-sentence{font-size:20px;line-height:1.8;margin:16px 0 0}

const FLOW_NAMES=['动手看懂','讲清关系','原题重做','举一反三','隔天再试'];
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function recordFor(id=s.lesson){return s.records[id]||(s.records[id]={game:false,bridge:false,checks:{},finishedDay:null,reviews:[]});}
function cleanChallenge(){return {answers:[],reason:'',attempts:0,hints:0,passed:false,feedback:'',type:'',assisted:false,firstTry:false,note:''};}
function reviewTask(id,n){
 if(!n)return BANK[id].review;
 const a=n+4;
 if(id==='juice')return task(`一桶饮料的2/5是${a*20}毫升。整桶多少毫升？`,rel('已知量对应几份？','2份','5份','3份'),[field('整桶',a*50,'毫升')],['先找已知量对应的份数。','2份已知，整桶5份。','先除以2求1份，再乘5。'],`${a*20}÷2×5＝${a*50}毫升。`);
 if(id==='cookies')return task(`姐姐的贴纸比妹妹多1/2。姐姐有${a*3}张，妹妹有多少张？`,rel('完整的2份是谁？','妹妹','姐姐','两人合计'),[field('妹妹',a*2,'张')],['找“比谁多”里的谁。','妹妹2份，姐姐3份。','已知姐姐3份，先求1份。'],`${a*3}÷3×2＝${a*2}张。`);
 if(id==='factory')return task(`甲乙丙按2∶3∶5混合，各有${a*30}千克，乙用完。甲剩多少？丙需补多少？`,rel('已知库存对应乙的几份？','3份','10份','5份'),[field('甲剩余',a*10,'千克'),field('丙需补',a*20,'千克')],['先锁定乙。','乙3份，用库存除以3。','计算甲用2份、丙用5份，再与库存比较。'],`每份${a*10}；甲剩${a*10}，丙补${a*20}。`);
 if(id==='cake')return task(`三角形与梯形面积比1∶${a}。从长方形左上角连到底边，三角形底边占整条底边多少？`,rel('三角形占整个长方形多少？',`1/${a+1}`,`1/${a}`,`2/${a+1}`),[field('底边占比',2/(a+1),'','fraction')],['总份数要相加。','三角形占总面积的1份。','底边占比是面积占比的2倍。'],`底边占2/${a+1}。`);
 if(id==='salt')return task(`糖∶水原来1∶4，加入${a*2}克糖后，糖占糖水1/3。原糖水多少克？`,rel('不变的是？','水','糖','糖水'),[field('原糖水',a*10,'克')],['后来糖∶水＝1∶2。','同样4份水，原糖1份，后来糖2份。','新加的糖恰好1份；原糖水共5份。'],`${a*2}×5＝${a*10}克。`);
 if(id==='race')return task(`同一路程，甲车${a}小时，乙车${a+2}小时。求甲∶乙的时间比和速度比。`,rel('哪辆更快？','甲车','乙车','一样快'),[field('甲∶乙时间比',a/(a+2),'','ratio'),field('甲∶乙速度比',(a+2)/a,'','ratio')],['两问对象顺序一样。','时间直接按已知写比。','同路程，速度按时间的倒数写比。'],`时间${a}∶${a+2}，速度${a+2}∶${a}。`);
 if(id==='fold'){const w=a+5;return task(`同样折法，左条占原纸2/${w}，右侧正方形。阴影占原纸多少？`,rel('原纸高几格？（宽按分母取格数）',String(w-2),String(w),String(w-4)),[field('阴影占比',2*(w-4)/(w*(w-2)),'','fraction')],['先用正方形确定原高。','阴影高等于原高减2。','阴影面积除以原纸面积。'],`阴影2×${w-4}，原纸${w}×${w-2}。`,{figure:'fold',paper:[w,2]});}
 if(id==='book')return task(`${a*2}天完成全任务的2/5。剩余任务还需几天？`,rel('剩余对应几份？','3份','2份','5份'),[field('还需',a*3,'天')],['已完成2份，还剩3份。','先求一份需要的天数。','已用时间除以2，再乘3。'],`${a*2}÷2×3＝${a*3}天。`);
 return task(`甲拿出贴纸的1/2，乙拿出贴纸的3/4，两人拿出的都是${a*3}张。原来各有多少？`,rel('谁原来更多？','甲','乙','相同'),[field('甲',a*6,'张'),field('乙',a*4,'张')],['拿出的比例小，原量会更大。','分别把已知数量看作各自的部分。','甲除以1/2，乙除以3/4。'],`甲${a*6}张，乙${a*4}张。`);

function taskFor(){return s.exam==='review'?reviewTask(s.lesson,s.reviewSerial||0):BANK[s.lesson][s.exam];}
function taskLabel(){const r=recordFor();return {original:BANK[s.lesson].original.source||'原题重做',near:'变式一 · 换数字',far:'变式二 · 换问法 / 情境',review:r.finishedDay&&today()>r.finishedDay?'隔天再试 · 新题':'同日加练 · 新题'}[s.exam];}
function flowIndex(){return s.mode==='play'?0:s.mode==='bridge'?1:s.mode==='exam'?(s.exam==='original'?2:s.exam==='review'?4:3):4;}
function flowRail(){return `<nav class="ma-route" aria-label="学习路径">${FLOW_NAMES.map((x,i)=>`<span class="${i===flowIndex()?'active':''}">${i+1} ${x}</span>`).join('')}</nav>`;}
function statusText(id){const r=s.records[id];if(!r)return '从这里出发';const n=['original','near','far'].filter(k=>r.checks[k]?.independent).length;if(r.reviews.some(x=>x.independent&&x.delayed))return '隔天新题独立完成';if(r.finishedDay)return `${n}/3题独立 · 待复习`;if(r.bridge)return '已完成关系练习';if(r.game)return '动手已完成';return '继续学习';}
function startExam(kind){s.exam=kind;s.mode='exam';s.examState=cleanChallenge();if(kind==='review'){const r=recordFor();s.reviewSerial=r.reviewSerial||0;r.reviewSerial=s.reviewSerial+1;}render();save();topOfTask();}
function normalizedNumber(value){const t=String(value).trim().normalize('NFKC').replaceAll('：',':').replaceAll('∶',':').replaceAll('／','/').replace(/\s/g,'');if(!t)return null;if(/^-?\d+(?:\.\d+)?%$/.test(t))return Number(t.slice(0,-1))/100;if(/^-?\d+(?:\.\d+)?$/.test(t))return Number(t);const m=t.match(/^(-?\d+(?:\.\d+)?)[/:](-?\d+(?:\.\d+)?)$/);if(m&&Number(m[2])!==0)return Number(m[1])/Number(m[2]);return null;}
function normalizedOrder(x){return String(x).normalize('NFKC').replace(/\s/g,'').toLowerCase();}
function fieldOK(value,f){if(f.type==='order')return normalizedOrder(value)===f.answer;const n=normalizedNumber(value);return n!==null&&Math.abs(n-f.answer)<1e-8;}
function submitExam(){const t=taskFor(),e=s.examState;
 if(e.passed)return;
 if(e.reason===''||t.fields.some((f,i)=>!String(e.answers[i]||'').trim())){e.feedback='先选清关系，再把每个空填上。还没填写的不算答错。';e.type='incomplete';render();return;}
 e.attempts++;
 const wrongRelation=Number(e.reason)!==t.relation.correct;
 const wrongFields=t.fields.map((f,i)=>fieldOK(e.answers[i],f)?null:f.label).filter(Boolean);
 if(wrongRelation||wrongFields.length){e.assisted=true;e.type=wrongRelation?'relation':'calculation';e.feedback=wrongRelation?'先修正数量关系。算出的数字即使碰巧正确，也还不能通过这一题。':`关系找对了，再检查“${wrongFields.join('、')}”。先核对它对应几份，以及问的是全部、剩余还是新增。`;render();save();return;}
 e.passed=true;e.type='passed';e.firstTry=e.attempts===1&&e.hints===0&&!e.assisted;e.feedback=e.firstTry?'这次你独立找对关系，也算对了。':'这次已经订正正确。因为使用了帮助或重试，我们把它记为“帮助后完成”。';
 const result={independent:e.firstTry,attempts:e.attempts,hints:e.hints,day:today(),answers:e.answers.map(x=>String(x).slice(0,40)),reason:Number(e.reason)};
 const r=recordFor();
 if(s.exam==='review'){result.delayed=!!r.finishedDay&&today()>r.finishedDay;r.reviews.push(result);r.reviews=r.reviews.slice(-2);}
 else r.checks[s.exam]=result;
 render();save();
}
function figureFor(t){if(!t.figure)return '';if(t.figure==='fold'){const [w,a]=t.paper,h=w-a,scale=180/w,X=n=>50+n*scale,Y=n=>15+n*scale;return svg(280,200,'原题折纸示意，未标辅助格与答案',`<rect x="50" y="15" width="180" height="${h*scale}" fill="#fff" stroke="#8a9b85" stroke-dasharray="4 4"/><rect x="50" y="15" width="${a*scale}" height="${(h-a)*scale}" fill="#a5d3b0"/><polygon points="${X(a)},15 ${X(a)},${Y(h)} ${X(w)},${Y(h)}" fill="#f1d39d" stroke="#8a9b85"/><polygon points="50,${Y(h-a)} ${X(a)},${Y(h-a)} ${X(a)},${Y(h)}" fill="#d0be8a" stroke="#8a9b85"/>`);}
 return svg(280,155,'原题长方形，A在左上角，底边从左下角量起',`<rect x="20" y="25" width="240" height="100" fill="#fff" stroke="#6e8c7b" stroke-width="2"/>${txt(20,18,'A')}${t.figure==='quarter'?'<line x1="20" y1="25" x2="80" y2="125" stroke="#587f6f" stroke-width="2"/>':''}${txt(20,147,'左端','start')}${txt(260,147,'右端','end')}`);
}
function optionOrder(items){const shift=(lessons.findIndex(l=>l.id===s.lesson)+(['original','near','far','review'].indexOf(s.exam)+1))%items.length;return items.map((text,index)=>({text,index})).slice(shift).concat(items.map((text,index)=>({text,index})).slice(0,shift));}
function assessmentView(){const t=taskFor(),e=s.examState;
return `<main class="ma-main">${flowRail()}<div class="ma-kicker">${lesson().icon} ${lesson().name}</div><h1>${taskLabel()}</h1><p class="ma-exam-intro">先自己想一想。需要时再点帮助。</p>${t.notice?`<p class="ma-notice">${t.notice}</p>`:''}<section class="ma-paper"><p>${t.body}</p>${figureFor(t)}</section><form id="ma-exam-form"><label class="ma-field"><span>先找关系：${t.relation.prompt}</span><select id="ma-reason" ${e.passed?'disabled':''}><option value="">请选择</option>${optionOrder(t.relation.options).map(({text:v,index:i})=>`<option value="${i}" ${String(e.reason)===String(i)?'selected':''}>${v}</option>`).join('')}</select></label><div class="ma-answer-fields">${t.fields.map((f,i)=>`<label class="ma-field"><span>${f.label}${f.unit?'（'+f.unit+'）':''}</span><input type="text" inputmode="${f.type==='number'?'decimal':'text'}" maxlength="40" data-answer="${i}" value="${escape(e.answers[i]||'')}" placeholder="${f.type==='fraction'?'例如 2/5':f.type==='ratio'?'例如 2:3':f.type==='order'?'例如 a>b>c':'填数字'}" autocomplete="off" ${e.passed?'disabled':''}></label>`).join('')}</div><label class="ma-field"><span>我为什么这样做？（可说给大人听，也可写一句）</span><textarea id="ma-explain" rows="2" maxlength="160" placeholder="先找……因为……" ${e.passed?'disabled':''}>${escape(e.note||'')}</textarea></label><p class="ma-caption">这句解释留给孩子与大人讨论，不由程序自动判断。</p>${!e.passed?'<button class="ma-primary" type="submit">检查关系和答案</button>':''}</form><div aria-live="polite">${e.feedback?`<div class="ma-feedback ${e.passed?'success':''}">${escape(e.feedback)}</div>`:''}</div>${e.hints?`<aside class="ma-repair"><strong>只补这一小步 · ${e.hints}/3</strong><p>${t.hints[e.hints-1]}</p><p class="ma-caption">保留你填的内容，想清楚后再检查。</p></aside>`:''}<div class="ma-footer">${e.passed?`<details class="ma-solution"><summary>核对完整过程</summary><p>${t.solution}</p></details>`:`<button type="button" class="ma-secondary" data-path="help" ${e.hints>=3?'disabled':''}>${e.hints?'再给一点帮助':'我需要一点帮助'}</button>`}${e.passed?'<button type="button" class="ma-primary" data-path="continue">继续下一步 →</button>':''}</div></main>`;
}
function bridgeView(){const b=BANK[s.lesson].bridge;return `<main class="ma-main">${flowRail()}<div class="ma-kicker">把游戏里的发现，带回数学题</div><h1>这一步，轮到你解释</h1><div class="ma-bridge"><p>🎮 ${b[0]}</p><span>↓</span><p>✏️ ${b[1]}</p></div><p class="ma-question">${b[2]}</p><div class="ma-choices">${optionOrder([b[4],b[3],b[5]]).map(({text:x,index:i})=>`<button class="ma-choice ${s.bridgeChoice===i?(s.bridgePassed?'right':'try'):''}" data-bridge="${i}" type="button" ${s.bridgePassed?'disabled':''}>${x}</button>`).join('')}</div><div aria-live="polite">${s.bridgeFeedback?`<p class="ma-feedback ${s.bridgePassed?'success':''}">${s.bridgeFeedback}</p>`:''}</div><div class="ma-footer"><button type="button" class="ma-secondary" data-path="backGame">回去动手看一遍</button><button type="button" class="ma-primary" data-path="startOriginal" ${s.bridgePassed?'':'disabled'}>收起图解，我来做题 →</button></div></main>`;}
function summaryView(){const r=recordFor(),keys=['original','near','far'],labels=[BANK[s.lesson].original.source||'原题','换数字','换问法 / 情境'];return `<main class="ma-main">${flowRail()}<div class="ma-win"><div class="ma-sticker">${lesson().icon}</div><h1>今天学到了哪一步？</h1><p>${lesson().tip}</p></div><div class="ma-checks">${keys.map((k,i)=>`<div><span>${labels[i]}</span><strong>${r.checks[k]?(r.checks[k].independent?'独立完成':'帮助后完成'):'还没做'}</strong></div>`).join('')}</div><p class="ma-caption">“独立完成”指首次提交时关系和答案都正确，且没看提示；不等同于长期掌握。</p><div class="ma-repair"><strong>下一站：隔天换一道题</strong><p>${r.finishedDay&&today()>r.finishedDay?'今天可以做隔天回测了。':'明天或以后再来，用一题没见过的题看看是否记住。现在也可以练，但会记作同日加练。'}</p></div>${r.reviews.length?`<div class="ma-checks">${r.reviews.map(x=>`<div><span>${x.day} · ${x.delayed?'隔天回测':'同日加练'}</span><strong>${x.independent?'独立完成':'帮助后完成'}</strong></div>`).join('')}</div>`:''}<div class="ma-actions"><button class="ma-primary" data-path="review" type="button">${r.finishedDay&&today()>r.finishedDay?'开始隔天回测':'现在换一道再练'}</button><button class="ma-secondary" data-act="map" type="button">回到学习地图</button></div></main>`;}
function pathAction(key){
if(key==='record'){s.mode='records';render();save();topOfTask();}
if(key==='startOriginal'&&s.bridgePassed)startExam('original');
if(key==='help'&&!s.examState.passed){s.examState.hints=Math.min(3,s.examState.hints+1);s.examState.assisted=true;render();save();}
if(key==='continue'&&s.examState.passed){if(s.exam==='original')startExam('near');else if(s.exam==='near')startExam('far');else{const r=recordFor();if(s.exam==='far')r.finishedDay=today();s.mode='summary';render();save();topOfTask();}}
if(key==='review')startExam('review');
if(key==='backGame'){s.mode='play';s.step=0;s.v=initial().v;resetStep();render();save();topOfTask();}
}
function render(){
if(s.mode==='records')root.innerHTML=header()+`<main class="ma-main"><h1>学习记录</h1><p>看原题、新题是否独立完成；游戏进度单独记录。</p>${lessons.map(l=>`<div class="ma-record-row"><span>${l.icon} ${l.name}<br><small>${statusText(l.id)}</small></span>${s.records[l.id]?.finishedDay?`<button type="button" class="ma-secondary" data-summary="${l.id}">查看与复习</button>`:`<button type="button" class="ma-secondary" data-lesson="${l.id}">进入学习</button>`}</div>`).join('')}</main>`;
else if(s.mode==='exam')root.innerHTML=header()+assessmentView();
else if(s.mode==='bridge')root.innerHTML=header()+bridgeView();
else if(s.mode==='summary')root.innerHTML=header()+summaryView();
else if(s.mode==='play'&&s.lesson==='juice')root.innerHTML=header()+picnicView();
else if(s.mode==='play'&&STORY_META[s.lesson])root.innerHTML=header()+storyView();
else{renderGame();if(s.mode==='play')root.querySelector('.ma-main')?.insertAdjacentHTML('afterbegin',flowRail());}
}
root.addEventListener('submit',e=>{if(e.target.id==='ma-exam-form'){e.preventDefault();submitExam();}});
root.addEventListener('input',e=>{if(e.target.dataset.answer!==undefined)s.examState.answers[Number(e.target.dataset.answer)]=e.target.value;if(e.target.id==='ma-explain')s.examState.note=e.target.value;});
root.addEventListener('change',e=>{if(e.target.id==='ma-reason')s.examState.reason=e.target.value;if(e.target.id==='ma-reason'||e.target.dataset.answer!==undefined||e.target.id==='ma-explain')save();});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.summary){s.lesson=b.dataset.summary;s.mode='summary';render();save();topOfTask();return;}if(b.dataset.path){pathAction(b.dataset.path);return;}if(b.dataset.bridge!==undefined){s.bridgeChoice=Number(b.dataset.bridge);s.bridgePassed=s.bridgeChoice===1;s.bridgeFeedback=s.bridgePassed?'你抓住了关键。请再用自己的话说一遍，再收起图解做题。':'再想一想：图里的动作，究竟对应题目中的哪种关系？';if(s.bridgePassed)recordFor().bridge=true;render();save();}});

function picnicView(){const c=config(),labels=['认识任务','分好3袋','备齐8袋','数出全部','认识分数'],next=['看看已经准备好的橘子 →','给另外5位装袋 →','数数一共有多少 →','把故事变成分数题 →','把发现带回题目 →'];return `<main class="ma-main picnic-main"><div class="picnic-progress" aria-label="动手看懂，第${s.step+1}步，共5步"><span>🍊 野餐分橘子</span><span>第${s.step+1}步 · ${labels[s.step]}</span></div><h1>${c.title}</h1><div class="picnic-story"><span aria-hidden="true">🦊</span><p>${s.step===0?'明天，8位小伙伴要去野餐。<br>每人一袋橘子，<strong>每袋一样多。</strong>':c.line}</p></div>${picnicScene()}<div aria-live="polite">${s.feedback?`<div class="ma-feedback ${s.passed?'success':''}">${escape(s.feedback)}</div>`:''}${s.hint&&!s.passed?`<div class="ma-feedback">${c.hint}</div>`:''}</div><div class="ma-footer picnic-footer"><div>${s.step>0?'<button class="ma-link" type="button" data-act="hint">给我一点提示</button>':''}${'speechSynthesis' in window?'<button class="ma-link" type="button" data-act="speak">🔊 读给我听</button>':''}</div><button type="button" class="ma-primary" ${s.step===0?'data-picnic="start"':'data-act="next"'} ${s.step===0||s.passed?'':'disabled'}>${next[s.step]}</button></div></main>`;}

function stInput(key){return storyState().inputs?.[`${s.step}:${key}`]||'';}
function stButton(text,key,disabled=false){return `<button class="ma-secondary" type="button" data-story-action="${key}" ${disabled||s.passed?'disabled':''}>${text}</button>`;}
function stChoices(question,items,enabled=true){return `<p class="ma-question">${question}</p><div class="ma-choices">${items.map(([value,label])=>`<button type="button" class="ma-choice" data-story-answer="${value}" ${s.passed||!enabled?'disabled':''}>${label}</button>`).join('')}</div>`;}
function stForm(fields,enabled=true){return `<form id="story-check" class="st-form">${fields.map(([key,label,format='number'])=>`<label class="ma-field"><span>${label}</span><input type="text" inputmode="${format==='number'?'decimal':'text'}" data-story-input="${key}" maxlength="30" value="${escape(stInput(key))}" placeholder="${format==='fraction'?'例如 2/5':format==='ratio'?'例如 2:3':'填数字'}" ${s.passed||!enabled?'disabled':''}></label>`).join('')}<button type="submit" class="ma-secondary" ${s.passed||!enabled?'disabled':''}>检查我的想法</button></form>`;}
function stNote(text){return `<p class="st-note">${text}</p>`;}
function stCookie(){return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#dca35e" stroke="#ac7641" stroke-width="2"/><circle cx="12" cy="14" r="2.5" fill="#79533a"/><circle cx="25" cy="11" r="2.5" fill="#79533a"/><circle cx="21" cy="25" r="3" fill="#79533a"/><circle cx="10" cy="26" r="2" fill="#79533a"/><circle cx="29" cy="24" r="2" fill="#79533a"/></svg>';}
function stDots(n,color='blue',cookie=false){return `<span class="st-dots" aria-label="${n}${cookie?'块饼干':'个'}">${Array.from({length:n},()=>`<span class="st-dot ${color}" aria-hidden="true">${cookie?stCookie():''}</span>`).join('')}</span>`;}
function stTray(label,body,tail=''){return `<div class="st-tray"><strong>${label}</strong><div>${body}</div>${tail?`<span class="st-tray-tail">${tail}</span>`:''}</div>`;}
function stGroups(n,size,label,color='blue'){return `<div class="st-groups">${Array.from({length:n},(_,i)=>`<div class="st-group"><small>第${i+1}份</small>${stDots(size,color)}<b>${size}次</b></div>`).join('')}</div>`;}
function stShell(content){return `<section class="st-world" aria-label="${config().title}的操作图">${content}</section>`;}
function storyView(){const c=config();return `<main class="ma-main picnic-main st-main"><div class="picnic-progress"><span>${lesson().icon} ${lesson().name}</span><span>第${s.step+1}步，共${pages()[s.lesson].length}步</span></div><h1>${c.title}</h1><div class="picnic-story"><span aria-hidden="true">🦊</span><p>${c.line}</p></div>${storyScene()}<div aria-live="polite">${s.feedback?`<div class="ma-feedback ${s.passed?'success':''}">${escape(s.feedback)}</div>`:''}${s.hint&&!s.passed?`<div class="ma-feedback">${c.hint}</div>`:''}</div><div class="ma-footer picnic-footer"><div>${s.step?'<button class="ma-link" type="button" data-act="hint">给我一点提示</button>':''}${'speechSynthesis' in window?'<button class="ma-link" type="button" data-act="speak">🔊 读给我听</button>':''}</div><button class="ma-primary" type="button" ${s.step===0?'data-story-action="start"':'data-act="next"'} ${s.step===0||s.passed?'':'disabled'}>${s.step===0?'我明白任务了，开始动手 →':s.step===pages()[s.lesson].length-1?'把发现带回题目 →':'下一小步 →'}</button></div></main>`;}
function storyScene(){return ({cookies:cookieScene,factory:beadScene,cake:cakeStoryScene,salt:saltStoryScene,race:raceStoryScene,fold:foldStoryScene,book:bookStoryScene,machines:machineStoryScene})[s.lesson]();}

function cookieScene(){const v=storyState(),k=s.step;
if(k<3){const rabbit=v.extra?6:v.same?4:0;
const bear=k===1?`<div class="st-dots">${Array.from({length:4},(_,i)=>`<button type="button" class="st-cookie-pick ${(v.half||[]).includes(i)?'picked':''}" data-story-action="half:${i}" aria-label="选熊熊的第${i+1}块作参照" ${!v.same||v.extra||s.passed?'disabled':''}>${stCookie()}</button>`).join('')}</div>`:stDots(4,'gold',true);
return stShell(`<div class="st-two">${stTray('🐻 熊熊',bear,'一直保留4块')}${stTray('🐰 兔兔',stDots(k===2?6:rabbit,'gold',true),k===0?'等待你帮它准备':`${k===2?6:rabbit}块`)}</div>${stNote('一块圆饼干＝1块。名字和盘子始终一一对应。')}${k===1?`<div class="st-actions">${stButton('从点心盒拿4块给兔兔','same',!!v.same)}${stButton('参照选中的一半，再给兔兔添饼干','extra',!v.same||!!v.extra)}</div>${stNote('点选熊熊盘里的一半作参照，饼干仍留在原盘。')}`:k===2?`${stButton('把兔兔的6块，每2块圈成一组','cookieGroups',!!v.groups)}${v.groups?`<div class="st-groups">${[1,2,3].map(i=>stTray(`第${i}组`,stDots(2,'gold',true))).join('')}</div>${stNote('少掉的2块，是兔兔3组中的1组。')}`:''}`:''}`)+(k===2?stChoices('熊熊比兔兔少几分之几？',[['half','1/2'],['third','1/3'],['two','2/3']],!!v.groups):'');}
if(k===3)return stShell(`<h2>👁 正常：1分钟24次</h2>${stNote('1个圆点＝1次眨眼。每框6次，共4框。点选其中3框给“写字”。')}<div class="st-four">${[0,1,2,3].map(i=>`<button type="button" class="st-select-group ${(v.writeGroups||[]).includes(i)?'picked':''}" data-story-action="write:${i}" ${s.passed?'disabled':''}><b>第${i+1}份</b>${stDots(6)}<span>6次</span></button>`).join('')}</div>`)+stForm([['writing','写字时每分钟眨眼几次？']],(v.writeGroups||[]).length===3);
if(k===4)return stShell(`${stButton('把写字的18次，平均分成6份','readingSplit',!!v.readingSplit)}${v.readingSplit?`${stTray('✏️ 写字：6份，共18次',stGroups(6,3,''))}${stTray('📖 看书：同样大的5份',stGroups(5,3,''))}`:stTray('✏️ 写字：已知18次',stDots(18))}${stNote('两行的每一份一样大。写字比看书多了这样的1份。')}`)+stForm([['reading','看书时每分钟眨眼几次？']],!!v.readingSplit);
return stShell(`${stTray('📖 看书：15次',stDots(15))}${stButton('把游戏画成2份，看书画成3份','gameParts',!!v.gameParts)}${v.gameParts?`${stTray('🎮 游戏：2份',stGroups(2,5,''))}${stTray('📖 看书：3份',stGroups(3,5,''))}${stNote('多出来的1份，是游戏2份的一半。')}`:''}`)+stForm([['gaming','玩游戏时每分钟眨眼几次？']],!!v.gameParts);
}
function beadFinished(){const m=storyState().made||0;if(!m)return '';return `<div class="st-finished"><p>用掉的珠子，串在这里：</p>${Array.from({length:m},(_,j)=>svg(140,140,'已经做好的第'+(j+1)+'条手链',`<circle cx="70" cy="62" r="43" fill="none" stroke="#adad92" stroke-width="2"/>${Array.from({length:10},(_,i)=>{const angle=i*Math.PI/5;return `<circle cx="${70+43*Math.cos(angle)}" cy="${62+43*Math.sin(angle)}" r="9" fill="${i<2?'#d78a76':i<5?'#e4b85b':'#70a5bf'}" stroke="white" stroke-width="1.5"/>`;}).join('')}<text x="70" y="69" text-anchor="middle" font-size="17" fill="#49634e">第${j+1}条</text>`)).join('')}</div>`;}
function beadStock(){const v=storyState(),m=v.made||0,x=v.blueExtra||0;return `<div class="st-stock">${[['红珠','red',6-2*m],['黄珠','gold',6-3*m],['蓝珠','blue',6+x-5*m]].map(([label,color,n])=>stTray(label,stDots(n,color),`盒里剩${n}颗`)).join('')}</div>${beadFinished()}`;}
function beadRecipe(){return `<div class="st-recipe">${[['红珠','red',2],['黄珠','gold',3],['蓝珠','blue',5]].map(([name,color,n])=>stTray(name,stDots(n,color),`${n}颗`)).join('')}</div>`;}
function beadScene(){const v=storyState(),k=s.step;if(k===0)return stShell(`<h2>每串1条，都要用这些珠子</h2>${beadRecipe()}${stNote('1个圆珠＝1颗。红、黄、蓝的颗数比是2∶3∶5。')}`);
if(k===1)return stShell(`<details open><summary>一条手链的配方</summary>${beadRecipe()}</details><h2>储物盒：三种珠子原来各6颗</h2>${beadStock()}${stButton('照配方串好第1条','make1',v.made>=1)}${v.made>=1?stNote('第1条做好：用了2红、3黄、5蓝。黄珠还剩3颗，正好够下一条。'):''}`);
if(k===2)return stShell(`${beadStock()}<h2>${v.made===2?'第二条使用了5颗蓝珠':'下一条需要5颗蓝珠'}</h2><div class="st-needed">${Array.from({length:5},(_,i)=>`<span class="st-dot blue ${i>=1+(v.blueExtra||0)?'missing':''}" aria-hidden="true"></span>`).join('')}</div>${stNote(`已补${v.blueExtra||0}颗蓝珠。空心位置表示还缺的珠子。`)}<div class="st-actions">${stButton('补1颗蓝珠','bluePlus',(v.blueExtra||0)>=6)}${stButton('退回1颗','blueMinus',!(v.blueExtra||0))}${stButton('检查后串第2条','make2')}</div>`);
if(k===3)return stShell(`<h2>已完成2条，黄珠正好用完</h2>${beadStock()}${stTray('从外面补来的蓝珠',stDots(v.blueExtra||0,'blue'))}`)+stForm([['left','红珠还剩几颗？'],['extra','蓝珠一共补了几颗？']]);
return stShell(`<h2>新任务：黄沙3份，共600吨</h2><div class="st-three">${[1,2,3].map(i=>stTray(`黄沙第${i}份`,'<span class="st-sack">黄沙</span>','? 吨')).join('')}</div>${stNote('600吨黄沙平均分成3份。每个框代表同样重的一份，用“吨”表示质量。')}`)+stForm([['unit','每份黄沙有多少吨？']]);
}
function cakeDiagram(foot=25,copy=false,quarters=false,given=false){const x=40,y=25,w=480,h=220,b=w*foot/100;return svg(560,285,'长方形蛋糕俯视图，纸片标成浅黄色',`<rect x="40" y="36" width="480" height="220" rx="8" fill="#d9b980"/><rect x="40" y="25" width="480" height="220" rx="6" fill="#fff2d7" stroke="#98734d" stroke-width="2"/>${quarters?Array.from({length:4},(_,i)=>`<rect x="${x+i*w/4}" y="${y}" width="120" height="220" fill="${given&&i===0?'#f1b75b':given?'#c9dfc2':'#fff2d7'}" stroke="#bd9c70"/><text x="${x+(i+.5)*w/4}" y="145" text-anchor="middle" fill="#526756" font-size="24">${given?(i===0?'小熊':'小兔'):'1份'}</text>`).join(''):`<polygon points="${x},${y} ${x},${y+h} ${x+b},${y+h}" fill="#eeb05e" stroke="#b57b37" stroke-width="2"/>${copy?`<polygon points="${x},${y} ${x+b},${y} ${x+b},${y+h}" fill="#f8e69c" stroke="#ba9e4f" stroke-dasharray="5 4"/><text x="${x+b*.7}" y="75" text-anchor="middle" fill="#776128" font-size="17">纸片</text>`:''}<text x="280" y="18" text-anchor="middle" font-size="15" fill="#477e68">一半的位置</text><path d="M280 25 V245" stroke="#477e68" stroke-dasharray="7 5" stroke-width="2"/><circle cx="${x+b}" cy="${y+h}" r="7" fill="#206e5c"/><text x="${x+b}" y="277" text-anchor="middle" fill="#206e5c" font-size="18">切点</text>`}`);}
function cakeStoryScene(){const v=storyState(),k=s.step;if(k===0)return stShell(`${cakeDiagram(25,false,true,false)}<div class="st-two">${stTray('🐻 小熊','1份')}${stTray('🐰 小兔','同样大小的3份')}</div>${stNote('图是从上面看蛋糕。先弄清楚各拿多少，再研究怎么切。')}`);
if(k===1)return stShell(`${cakeDiagram(25,false,true,!!v.bearGiven)}${stButton('把其中1份分给小熊','bearPiece',!!v.bearGiven)}${v.bearGiven?stNote('小熊拿4份中的1份，也就是整块的1/4；小兔拿另外3份。'):''}`);
if(k===2)return stShell(`${cakeDiagram(25,!!v.copy)}${stButton('描一张同样大的纸片，翻过来拼','copy',!!v.copy)}${v.copy?stNote('橙色是蛋糕，浅黄是纸片。两块拼在一起才铺满左边1/4，一块只有它的一半。'):stNote('切点在底边的1/4处。先别把它当作面积的1/4。')}`)+stChoices('原来的三角形占整块多少？',[['quarter','1/4'],['eighth','1/8'],['half','1/2']],!!v.copy);
if(k===3){const foot=v.foot??25;return stShell(`${cakeDiagram(foot,true)}<label class="st-slider">移动底边上的切点<input type="range" id="story-cut" min="5" max="95" step="5" value="${foot}" ${s.passed?'disabled':''}></label>${stNote(`<span id="story-cut-value">切点在底边的${foot}%。</span>浅黄色是描出的纸片，绿色虚线标着半块蛋糕。`)}`)+`<div class="st-actions">${stButton('检查：两块是否铺满半块蛋糕','cakeCheck')}</div>`;}
return stShell(`${cakeDiagram(50,!v.copyRemoved)}${stButton('收起纸片，只看原来的蛋糕','removeCopy',!!v.copyRemoved)}${v.copyRemoved?stNote('小熊的三角形占1/4。其余部分全部给小兔。'):''}`)+stForm([['rabbit','小兔占整块蛋糕的几分之几？','fraction']],!!v.copyRemoved);
}
function saltBottle(){return svg(350,200,'瓶中的盐水由水和盐组成',`<path d="M137 15 H213 V55 Q260 65 260 105 V178 Q175 198 90 178 V105 Q90 65 137 55 Z" fill="#e7f4f4" stroke="#60928e" stroke-width="4"/><path d="M94 110 H256 V175 Q175 191 94 175 Z" fill="#a9d2de"/><text x="175" y="149" text-anchor="middle" font-size="24" fill="#325964">盐水</text><text x="175" y="178" text-anchor="middle" font-size="16" fill="#325964">水 ＋ 盐</text>`);}
function saltSquares(n,kind='water'){return `<span class="st-mass-cells">${Array.from({length:n},()=>`<i class="${kind}" aria-hidden="true"></i>`).join('')}</span>`;}
function saltStoryScene(){const v=storyState(),k=s.step;
if(k===0)return stShell(`${saltBottle()}<div class="st-two">${stTray('原来就有','💧 水 ＋ 🧂 盐')}${stTray('只准备加进去','🧂 15克盐')}</div>${stNote('盐已经溶在水里。下面研究质量，不用液面的高低当重量。')}`);
if(k===1)return stShell(`${saltBottle()}${stButton('倒入15克盐','addSalt',!!v.added)}<div class="st-three">${stTray('水的质量',v.added?'没加、没倒，保持原样':'原来那份水')}${stTray('盐的质量',v.added?'原来的盐＋15克':'原来就有盐')}${stTray('盐水总质量',v.added?'原来整瓶＋15克':'水和盐合起来')}</div>`)+stChoices('可以连接前后两次比较的，是哪个不变的量？',[['water','水的质量'],['salt','盐的质量'],['all','盐水的总质量']],!!v.added);
if(k===2)return stShell(`<h2>后来盐水共9份：1份盐，其余是水</h2><div class="st-nine">${Array.from({length:9},(_,i)=>`<button class="st-mass-part ${i?'water':'salt'} ${(v.waterSelected||[]).includes(i)?'picked':''}" type="button" data-story-action="water:${i}" ${s.passed?'disabled':''}>${i?'💧 水':'🧂 盐'}<small>同样重的1份</small></button>`).join('')}</div>${stNote(`点水：已选${(v.waterSelected||[]).length}份。每个框代表同样多的质量。`)}${s.passed?stNote('盐1份，水8份，所以后来盐∶水＝1∶8。'):''}`);
if(k===3){const g=v.group||11,groups=88/g,seen=v.groupsSeen||[];return stShell(`<div class="st-actions">${stButton('原来：每11格水配1格盐','group:11')}${stButton('后来：每8格水配1格盐','group:8')}</div><h2>同一份水，都是88小格</h2><div class="st-water-groups">${Array.from({length:groups},(_,i)=>`<div><small>第${i+1}组</small>${saltSquares(g)}</div>`).join('')}</div>${stNote(`现在分成${groups}组水，每组配1格盐，所以配${groups}格盐。`)}<div class="st-two">${stTray('原来的盐',seen.includes(11)?saltSquares(8,'salt'):'先点“原来”观察',seen.includes(11)?'8格':'')}${stTray('后来的盐',seen.includes(8)?saltSquares(11,'salt'):'再点“后来”观察',seen.includes(8)?'11格':'')}</div>${stNote('选88格，因为11×8＝88。每小格代表同样多的质量；每格多少克，下一步再求。')}`)+stForm([['added','后来比原来多了几格盐？']],seen.includes(11)&&seen.includes(8));}
if(k===4){const gram=v.gram||1;return stShell(`<h2>只有这3格，是新加的15克盐</h2><div class="st-three">${[1,2,3].map(i=>stTray(`新增第${i}格`,`🧂 ${gram}克`)).join('')}</div><p class="st-big">现在合计：${gram*3}克</p><div class="st-actions">${stButton('每格增加1克','gramPlus',gram>=15)}${stButton('每格减少1克','gramMinus',gram<=1)}${stButton('检查：3格合起来是15克吗','gramCheck')}</div>`);}
return stShell(`<div class="st-original-mass"><h2>加盐以前：要计算这一部分</h2>${stTray('水：88格',saltSquares(88),'每格5克')}${stTray('原来的盐：8格',saltSquares(8,'salt'),'每格5克')}</div><div class="st-new-mass">新加的3格盐，留在计算范围外：${saltSquares(3,'salt')}</div>`)+stForm([['original','原来的水和盐合起来多少克？']]);
}
function raceDiagram(hour=0,split=false){return `<div class="st-road-map">${[['红车',6,4,'red'],['蓝车',8,3,'blue']].map(([name,t,speed,color])=>`<div class="st-road"><div class="st-road-head"><strong>${name}</strong><span>${hour?'同样经过1小时':'全程用'+t+'小时'}</span></div>${split?`<div class="st-hour-parts ${color}" style="grid-template-columns:repeat(${t},1fr)">${Array.from({length:t},()=>'<span>1小时</span>').join('')}</div>`:''}<div class="st-road-track"><span class="st-car ${color}" style="left:${hour*speed/24*100}%"><svg viewBox="0 0 48 32" aria-hidden="true"><path d="M3 13 H11 L17 4 H31 L37 13 H45 V25 H3 Z" fill="currentColor" stroke="white" stroke-width="1.5"/><path d="M18 7 H29 L33 13 H14 Z" fill="#dcedf1"/><circle cx="12" cy="26" r="5" fill="#4a5d59"/><circle cx="36" cy="26" r="5" fill="#4a5d59"/></svg></span></div><div class="st-road-ends"><span>起点 0</span><span>公园 24千米</span></div>${hour?`<p class="st-road-distance">${name}1小时走${speed}千米</p>`:''}</div>`).join('')}${stNote('两行是同样长的路。每个小刻度间隔代表1千米。')}</div>`;}
function raceStoryScene(){const v=storyState(),k=s.step;if(k===0)return stShell(`${raceDiagram()}${stNote('用24千米作这次练习的路程，帮助我们把时间和距离画出来。')}`);
if(k===1)return stShell(`${raceDiagram(0,!!v.split)}${stButton('把两条路分别按6小时、8小时分开','roadSplit',!!v.split)}${v.split?stNote('上面的红长段每段4千米；下面的蓝短段每段3千米。每段都对应1小时。'):''}`)+stChoices('同样1小时，哪辆车走得更多？',[['red','红车'],['blue','蓝车'],['same','一样多']],!!v.split);
if(k===2)return stShell(`${raceDiagram(v.hour||0,true)}${stButton('让两辆车同时走1小时','driveBoth',!!v.hour)}`)+stForm([['fast','红车1小时走几千米？'],['slow','蓝车1小时走几千米？']],!!v.hour);
if(k===3)return stShell(`<div class="st-ratio-row">${stTray('先：蓝色慢车','8小时')}<b>∶</b>${stTray('后：红色快车','6小时')}</div>${stNote('这里比的是走完全程用的时间。时间越少，车越快。')}`)+stForm([['time','慢车∶快车的时间比','ratio']]);

 let h=header();
 if(s.mode==='map')h+=`<main class="ma-main"><div class="ma-kicker">一次玩一关，慢慢发现</div><h1>今天去哪里探险？</h1><p>每次走完一条小路线：动手 → 讲清 → 原题 → 两道新题。</p><div class="ma-map">${lessons.map(l=>`<button type="button" class="ma-island" data-lesson="${l.id}"><span class="ma-island-icon">${l.icon}</span><strong>${l.name}</strong><small>${l.sub}</small>${`<span class="ma-earned">${statusText(l.id)}</span>`}</button>`).join('')}</div></main>`;
 else if(s.mode==='adult')h+=`<main class="ma-main ma-adult"><h1>让孩子自己发现关系</h1><p>每关先用游戏理解，再讲清数量关系。之后收起图解，独立填写原题与两道变式；隔天再做一道新题。关系和数值都正确才通过。</p><details open><summary>陪孩子时，只问这一句</summary><p>“你是怎么从图里看出来的？”先听完整，再决定是否点提示。系统分别记录首次独立完成、帮助后完成、隔天回测。孩子的口头或文字解释保留作讨论，不自动判定。</p></details><details><summary>九个故事，分别补什么</summary><p>分橘子：部分与整体；饼干：比较基准及连续关系；彩珠：按配方消耗库存；蛋糕：底边与面积；盐水：不变量；赛车：同路程速度与时间；折纸：原面积与阴影；故事书：剩余时间；机器人：等值算式反推。</p></details><details><summary>这份试卷中需要保留的说明</summary><p>沙子题的分子被遮挡，所以分橘子这一关的同类题使用明确的新编条件3/8。折纸关按照片所示标准折法。机器人关明确使用正数，原卷只写非零，条件不够严谨。眨眼题第二问10次数值正确，但卷面过程不成立。</p></details><details><summary>设计依据与使用边界</summary><p>参考 IES 分数教学建议与 EEF 表征教学建议：让操作和数量关系明确对应，再逐步过渡到独立解题。本工具还没有经过孩子实际试学，不能把完成贴纸当作学习效果证明。</p><p><a href="https://ies.ed.gov/learn/blog/two-practical-strategies-unlocking-fractions-preview-teaching-fractions-toolkit" target="_blank" rel="noopener">IES：图解分数与比率</a> · <a href="https://educationendowmentfoundation.org.uk/newsletter/improving-mathematics-in-key-stages-2-and-3-email-course-2" target="_blank" rel="noopener">EEF：教具与数学表征</a></p></details><div class="ma-actions">${act('回到孩子的这一关','resume',true)}</div></main>`;
 else if(s.mode==='win'){const l=lesson();h+=`<main class="ma-main ma-win"><div class="ma-kicker">你完成了一个小发现</div><div class="ma-sticker">${l.icon}</div><h1>${l.badge}</h1><p>${l.tip}</p><div class="ma-statement">试着对大人说：<br>“我刚才发现了……”</div><div class="ma-actions">${act('收好贴纸，去地图','map',true)}${act('再玩一次','replay')}</div><p class="ma-caption">今天玩到这里也很好。下次换个数字再试。</p></main>`;}
 else{
  const c=config(),l=lesson(),total=pages()[s.lesson].length;
  h+=`<main class="ma-main"><div class="ma-kicker">${l.icon} ${l.name} · 第 ${s.step+1} / ${total} 步</div><h1>${c.title}</h1><div class="ma-progress" aria-label="第${s.step+1}步，共${total}步">${Array.from({length:total},(_,i)=>`<span class="ma-dot ${i<=s.step?'on':''}"></span>`).join('')}</div><div class="ma-guide"><span class="ma-avatar" aria-hidden="true">🦊</span><p class="ma-speech">${c.line}</p></div><section class="ma-scene" id="ma-stage" aria-label="动手观察区">${draw()}</section><p class="ma-question">${c.question}</p>${c.choices.length?`<div class="ma-choices">${c.choices.map((a,i)=>`<button class="ma-choice ${s.selected===i?(s.passed?'right':'try'):''}" type="button" data-choice="${i}" ${s.passed?'disabled':''}>${a.label}</button>`).join('')}</div>`:''}<div id="ma-response" aria-live="polite">${s.feedback?`<div class="ma-feedback ${s.passed?'success':''}">${s.passed?'✨ ':'🔎 '}${escape(s.feedback)}</div>`:''}${s.hint&&!s.passed?`<div class="ma-feedback">🦊 小提示：${c.hint}</div>`:''}</div><div class="ma-footer"><div><button class="ma-link" type="button" data-act="hint">给我一点提示</button>${'speechSynthesis' in window?'<button class="ma-link" type="button" data-act="speak">🔊 读给我听</button>':''}</div><button type="button" class="ma-primary" data-act="next" ${s.passed?'':'disabled'}>${s.step===total-1?'把发现带回题目 →':'下一小步 →'}</button></div></main>`;
 }
 root.innerHTML=h;
}
function pass(message){s.passed=true;s.feedback=message;s.hint=false;}
function retry(message){s.feedback=message;s.wrong++;if(s.wrong>=2)s.hint=true;}
function resetStep(){s.passed=false;s.feedback='';s.selected=null;s.wrong=0;s.hint=false;}
function topOfTask(){root.querySelector('.ma-main')?.scrollIntoView({block:'start',behavior:'instant'});}
function begin(id){const done=s.done,records=s.records;s={...initial(),lesson:id,done,records};render();save();topOfTask();}
function stopSpeech(){try{window.speechSynthesis?.cancel();}catch{}speaking=false;}
function action(key){const v=s.v,c=config();
 if(key!=='speak')stopSpeech();
 if(key==='map'){s.mode='map';}
 if(key==='resume')s.mode=s.returnMode||'play';
 if(key==='replay'){begin(s.lesson);return;}
 if(key==='hint')s.hint=!s.hint;
 if(key==='next'&&s.passed){if(s.step===pages()[s.lesson].length-1){recordFor().game=true;s.mode='bridge';s.bridgePassed=false;s.bridgeChoice=null;s.bridgeFeedback='';}else{s.step++;resetStep();if(s.lesson==='cake'&&s.step===3)v.foot=25;}}
 if(key==='give'&&!s.passed){if(v.half.length===2){v.extra=true;pass('兔兔先有同样的4块，再多2块，所以一共有6块。');}else retry(`你选了${v.half.length}块。4块的一半应该是2块，再选选看。`);}
 if(key==='make'&&!s.passed){v.batches=1;pass('第一份做好了！奶剩4杯、果汁剩3杯、冰剩1块。下一份会缺什么呢？');}
 if(key==='checkCut'&&!s.passed){const target=s.step===3?40:50;if(v.foot===target)pass(s.step===3?'切对了！底边占2/5，三角形面积占1/5，另一块占4/5。':'切对了！落在底边中点，三角形刚好占整块的1/4。');else retry(`现在小熊得到了整块的${v.foot/2}%。目标是${target/2}%。${v.foot<target?'向右移一些，小熊的蛋糕会变大。':'向左移一些，小熊的蛋糕会变小。'}`);}
 if(key==='clone')v.clone=true;
 if(key==='water11'){v.waterGroup=11;v.saltAdded=false;}
 if(key==='water8'){v.waterGroup=8;v.saltAdded=true;pass('水仍然88格。原来配8格盐，后来配11格盐，多了3格。');}
 if(key==='drive'){v.raceHour=1;pass('一起跑1小时：快车4段，慢车3段。速度，就是同样时间里跑多远。');}
 if(key==='fold'){v.foldStage=Math.min(2,v.foldStage+1);if(v.foldStage===2)pass('两次都折好了！左上方剩下一个宽2格、高3格的绿色区域。');}
 if(key==='splitBook')v.bookSplit=true;
 if(key==='robot'){v.robot=1;pass('a只拿出2/3就够1，所以原来超过1；b、c原来都小于1。');}
 if(key==='speak'){try{const u=new SpeechSynthesisUtterance(`${c.title}。${c.line}。${c.question}${s.feedback?'。'+s.feedback:''}`);u.lang='zh-CN';u.rate=.9;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);speaking=true;}catch{s.feedback='这台设备暂时不能朗读，可以请大人读一下上面的短句。';}}
 render();save();if(['next','map','resume'].includes(key))topOfTask();
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.nav){stopSpeech();s.returnMode=s.mode;s.mode=b.dataset.nav;render();save();topOfTask();return;}
 if(b.dataset.lesson){stopSpeech();begin(b.dataset.lesson);return;}
 if(b.dataset.act){action(b.dataset.act);return;}
 if(b.dataset.choice!==undefined&&!s.passed){const i=+b.dataset.choice,a=config().choices[i];if(!a)return;s.selected=i;if(a.right){if(s.lesson==='factory'&&s.step===2){s.v.batches=2;s.v.supplement=4;}pass(a.feedback);}else retry(a.feedback);render();save();return;}
 if(b.dataset.half!==undefined&&!s.passed){const i=+b.dataset.half;s.v.half=s.v.half.includes(i)?s.v.half.filter(x=>x!==i):[...s.v.half,i];render();save();return;}
 if(b.dataset.shade!==undefined&&!s.passed){const i=+b.dataset.shade;if(!s.v.shaded.includes(i))s.v.shaded.push(i);if(s.v.shaded.length===6)pass('找到6颗星！2列、每列3格，阴影一共6格。');render();save();return;}
 if(b.dataset.day!==undefined&&!s.passed){const i=+b.dataset.day;if(i<6)retry('这天已经读过啦。我们只给“接下来要读”的日子盖章。');else{if(!s.v.days.includes(i))s.v.days.push(i);s.feedback='';if(s.v.days.length===3)pass('还要3天！已经6天，加上接下来3天，一共9天。');}render();save();}
});
root.addEventListener('input',e=>{if(e.target.id==='ma-cut'){s.v.foot=+e.target.value;resetStep();const stage=$('#ma-stage'),preview=document.createElement('div');preview.innerHTML=draw();stage.querySelector('.ma-svg').replaceWith(preview.querySelector('.ma-svg'));stage.querySelector('.ma-statement').replaceWith(preview.querySelector('.ma-statement'));$('#ma-response').innerHTML='';const next=root.querySelector('[data-act="next"]');if(next)next.disabled=true;}});
root.addEventListener('change',e=>{if(e.target.id==='ma-cut')save();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
try{restore(window.openai?.widgetState||JSON.parse(localStorage.getItem(storageKey)||'null'));}catch{}
render();
})();
</script>

</body></html>
