<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学探险队 · 从零理解分数</title><style>body{margin:0;padding:16px;background:#eaf0e9}body>#math-adventure{max-width:1040px;margin:auto}@media(max-width:600px){body{padding:0}}</style></head><body>
<div id="math-adventure" lang="zh-CN"></div>
<style>
#math-adventure{--ink:#243e43;--muted:#607579;--paper:#fffdf6;--surface:#fff;--green:#207665;--mint:#e4f3e7;--line:#dbe6df;--orange:#f3aa54;--blue:#78bdd7;--pink:#edb2ac;--purple:#b5a6db;color-scheme:light;color:var(--ink);font:17px/1.65 ui-rounded,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);border-radius:24px;overflow:hidden;max-width:100%;text-align:left;box-sizing:border-box}
#math-adventure *{box-sizing:border-box}
#math-adventure button,#math-adventure input{font:inherit}
#math-adventure button{cursor:pointer;touch-action:manipulation}
#math-adventure button:focus-visible,#math-adventure input:focus-visible{outline:3px solid #d27a2b;outline-offset:4px}
#math-adventure button:disabled{cursor:default;opacity:.5}
#math-adventure h1,#math-adventure h2,#math-adventure h3,#math-adventure p{margin:0}
#math-adventure .ma-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;background:var(--mint);flex-wrap:wrap}
#math-adventure .ma-brand{font-size:18px;font-weight:750;letter-spacing:.04em}
#math-adventure .ma-top-actions{display:flex;gap:8px;flex-wrap:wrap}
#math-adventure .ma-link{border:0;background:transparent;color:var(--green);padding:8px 10px;min-height:44px;font-size:14px;border-radius:12px}
#math-adventure .ma-link:hover{background:#d3e9d8}
#math-adventure .ma-main{padding:24px;max-width:900px;margin:auto}
#math-adventure .ma-kicker{font-size:13px;letter-spacing:.09em;color:var(--muted);font-weight:600}
#math-adventure h1{font-size:clamp(24px,4vw,32px);line-height:1.35;font-weight:750;margin:5px 0 16px}
#math-adventure h2{font-size:22px;line-height:1.45;font-weight:700}
#math-adventure .ma-progress{display:flex;gap:5px;margin:0 0 20px}
#math-adventure .ma-dot{height:5px;background:#e2e9e3;border-radius:8px;flex:1}
#math-adventure .ma-dot.on{background:var(--green)}
#math-adventure .ma-guide{display:flex;align-items:center;gap:14px;margin-bottom:20px}
#math-adventure .ma-avatar{font-size:36px;width:60px;flex:0 0 60px;aspect-ratio:1;display:grid;place-items:center;background:#ffebce;border-radius:22px 22px 22px 7px}
#math-adventure .ma-speech{font-size:19px;line-height:1.65;max-width:640px}
#math-adventure .ma-scene{background:#f1f6ef;border-radius:20px;padding:24px 22px;margin:14px 0 20px;min-height:220px;position:relative}
#math-adventure .ma-caption{font-size:14px;color:var(--muted);text-align:center;margin-top:12px}
#math-adventure .ma-question{font-size:20px;font-weight:650;margin:18px 0 12px}
#math-adventure .ma-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#math-adventure .ma-choice{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 12px;min-height:64px;line-height:1.4;color:var(--ink);font-size:18px;font-weight:600;transition:transform .15s,border-color .15s}

#math-adventure .ma-choice.right{background:#e0f3df;border-color:var(--green)}
#math-adventure .ma-choice.try{background:#fff3dd;border-color:#dbac62}
#math-adventure .ma-feedback{margin-top:14px;padding:13px 16px;background:#fff0d4;border-radius:14px;color:#69491a;line-height:1.7}
#math-adventure .ma-feedback.success{background:#e1f2df;color:#285e35}
#math-adventure .ma-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
#math-adventure .ma-primary{background:var(--green);color:#fff;border:0;border-radius:15px;min-height:52px;padding:12px 24px;font-weight:650;font-size:18px;box-shadow:0 4px 0 #155247}
#math-adventure .ma-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #155247}
#math-adventure .ma-secondary{background:#fff;border:2px solid var(--line);color:var(--ink);border-radius:14px;min-height:48px;padding:9px 17px;font-weight:600}
#math-adventure .ma-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
#math-adventure .ma-statement{background:#fff;border-radius:13px;padding:10px 15px;margin:10px auto;max-width:550px;text-align:center}
#math-adventure .ma-cups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin:24px 0 8px;align-items:end}
#math-adventure .ma-cup{height:108px;border:3px solid #799d98;border-top:0;border-radius:3px 3px 17px 17px;background:#fff;position:relative;overflow:hidden;display:flex;align-items:end;padding:0;color:var(--ink);min-width:0}
#math-adventure .ma-juice{width:100%;height:var(--fill);background:var(--orange);transition:height .35s ease}
#math-adventure .ma-cup-label{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:650;pointer-events:none}
#math-adventure .ma-cup:disabled{opacity:1}
#math-adventure .ma-cup.empty{border-style:dashed;background:transparent}
#math-adventure .ma-bracket{display:grid;grid-template-columns:3fr 5fr;gap:10px;font-size:14px;text-align:center}
#math-adventure .ma-bracket span{border-top:2px solid #7b9994;padding-top:5px}
#math-adventure .ma-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}
#math-adventure .ma-row-name{min-width:80px;font-size:16px;font-weight:600}
#math-adventure .ma-items{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-height:48px}
#math-adventure .ma-token{font-size:30px;line-height:1.3;min-width:39px;min-height:44px;display:grid;place-items:center;border:0;background:transparent;padding:2px;position:relative}
#math-adventure .ma-token.add{background:#ffe7b5;border-radius:10px}
#math-adventure .ma-token.faded{opacity:.18;filter:grayscale(1)}
#math-adventure .ma-counter{display:inline-block;background:#fff;padding:5px 12px;border-radius:10px;font-weight:650;margin-left:auto}
#math-adventure .ma-recipe{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:600;font-size:17px}
#math-adventure .ma-supply{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;margin:18px 0}
#math-adventure .ma-supply .ma-items{gap:2px}
#math-adventure .ma-supply .ma-token{font-size:25px;min-width:30px}
#math-adventure .ma-svg{display:block;width:100%;max-width:620px;margin:auto;touch-action:pan-y}
#math-adventure .ma-svg text{font-family:inherit;fill:var(--ink);font-size:16px}
#math-adventure .ma-svg .ma-small{font-size:13px}
#math-adventure .ma-slider{display:block;width:100%;accent-color:var(--green);margin:16px 0 4px;min-height:36px;cursor:ew-resize}
#math-adventure .ma-range-label{display:block;text-align:center;font-size:14px}
#math-adventure .ma-water{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:500px;margin:12px auto}
#math-adventure .ma-water i{aspect-ratio:1.6;background:#79bdd8;border-radius:3px}
#math-adventure .ma-salt-pieces{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:14px auto}
#math-adventure .ma-salt-piece{height:28px;width:28px;border-radius:6px;background:#f2be62;display:grid;place-items:center;font-size:13px;font-style:normal}
#math-adventure .ma-salt-piece.new{background:#bd9ada}
#math-adventure .ma-track{position:relative;background:#dbe9d9;height:58px;border-radius:14px;margin:8px 22px 26px}
#math-adventure .ma-distance{height:100%;background:#b3d4ad;border-radius:14px;transition:width .6s}
#math-adventure .ma-racer{position:absolute;left:var(--pos);top:4px;transform:translateX(-50%);font-size:34px;transition:left .6s}
#math-adventure .ma-finish{position:absolute;right:-18px;top:7px;font-size:27px}
#math-adventure .ma-road-ticks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(24,1fr);pointer-events:none}
#math-adventure .ma-road-ticks i{border-right:1px solid #5f875526;margin:7px 0}
#math-adventure .ma-days{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin:24px 0}
#math-adventure .ma-day{border:0;border-radius:10px;min-height:66px;background:#fff;display:grid;place-content:center;gap:3px;font-size:18px;color:var(--ink)}
#math-adventure .ma-day.read{background:#cddfc7}
#math-adventure .ma-day.picked{background:#ffdda3}
#math-adventure .ma-day small{font-size:12px}
#math-adventure .ma-books{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:540px;margin:14px auto}
#math-adventure .ma-book{border-radius:8px 14px 14px 8px;border-left:8px solid #527f72;background:#d3e7dd;text-align:center;padding:24px 8px;min-height:130px;font-size:17px;font-weight:600}
#math-adventure .ma-book.rest{background:#f4ddab;border-color:#b98d47}
#math-adventure .ma-book span{font-size:30px;display:block}
#math-adventure .ma-machines{display:grid;gap:10px}
#math-adventure .ma-machine{display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:8px;text-align:center}
#math-adventure .ma-machine strong{font-size:20px}
#math-adventure .ma-machine-middle{background:#dbe6dd;border-radius:12px;padding:14px 8px;font-size:15px}
#math-adventure .ma-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:24px}
#math-adventure .ma-island{position:relative;border:2px solid var(--line);border-radius:22px;padding:22px 15px;background:#fff;text-align:left;color:var(--ink);min-height:180px}
#math-adventure .ma-island:hover{border-color:#72a994;transform:translateY(-2px)}
#math-adventure .ma-island-icon{font-size:38px;display:block;margin-bottom:10px}
#math-adventure .ma-island strong{font-size:18px;display:block}
#math-adventure .ma-island small{font-size:14px;color:var(--muted);display:block;margin-top:5px}
#math-adventure .ma-earned{position:absolute;right:12px;top:13px;color:var(--green);font-size:13px}
#math-adventure .ma-win{text-align:center;padding:16px 0}
#math-adventure .ma-sticker{font-size:74px;line-height:1.3;margin:12px}
#math-adventure .ma-win p{max-width:520px;margin:14px auto;font-size:19px}
#math-adventure .ma-adult{font-size:16px;line-height:1.85}
#math-adventure .ma-adult details{background:white;border-radius:12px;padding:14px 16px;margin:12px 0}
#math-adventure .ma-adult summary{cursor:pointer;font-weight:650}
#math-adventure .ma-adult a{color:var(--green);text-decoration:underline}
#math-adventure .ma-adult p{margin:10px 0}
#math-adventure .ma-tag{font-size:13px;padding:4px 9px;border-radius:8px;background:#fff;color:var(--green)}
#math-adventure .ma-foldboard{position:relative;max-width:100%;margin:auto}
#math-adventure .ma-treasure{position:absolute;border:0;background:transparent;color:#266443;border-radius:3px;font-size:22px;padding:0;display:grid;place-items:center;min-width:0;min-height:0}
#math-adventure .ma-treasure:hover{background:#ffffff66}
#math-adventure .ma-foldcell{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:0}
#math-adventure .ma-foldcell:hover{fill:#ffffff55}
#math-adventure .ma-clone{transform-origin:0 0;animation:ma-clone .65s ease-out both}
@keyframes ma-clone{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){#math-adventure .ma-main{padding:20px 16px}#math-adventure .ma-top{padding:12px 16px}#math-adventure .ma-scene{padding:20px 12px}#math-adventure .ma-choices{grid-template-columns:1fr}#math-adventure .ma-choice{min-height:52px;padding:11px}#math-adventure .ma-map{grid-template-columns:repeat(2,minmax(0,1fr))}#math-adventure .ma-avatar{width:46px;flex-basis:46px;font-size:30px}#math-adventure .ma-speech{font-size:18px}#math-adventure .ma-cups{gap:5px}#math-adventure .ma-cup{height:85px;border-width:2px}#math-adventure .ma-cup-label{font-size:15px}#math-adventure .ma-supply{grid-template-columns:42px 1fr auto;gap:6px}#math-adventure .ma-supply .ma-counter{font-size:14px;padding:3px 6px}#math-adventure .ma-supply .ma-token{font-size:23px;min-width:25px}#math-adventure .ma-days{gap:3px}#math-adventure .ma-day{min-height:58px;font-size:16px}#math-adventure .ma-day small{font-size:11px}}
@media(prefers-reduced-motion:reduce){#math-adventure *,#math-adventure *::before{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
#math-adventure .ma-exam-intro{color:#607579;margin-bottom:16px}
#math-adventure .ma-paper{background:#fff;border:1px solid #dbe6df;border-radius:18px;padding:22px;margin:18px 0;font-size:20px;line-height:1.85}
#math-adventure .ma-paper .ma-svg{max-width:340px;margin:18px auto 0}
#math-adventure .ma-field{display:grid;gap:7px;margin:16px 0;font-size:17px}
#math-adventure .ma-field span{font-weight:600}
#math-adventure .ma-field input,#math-adventure .ma-field select,#math-adventure .ma-field textarea{width:100%;min-width:0;min-height:50px;border:2px solid #dbe6df;border-radius:12px;padding:10px 13px;color:#243e43;background:white;box-sizing:border-box}
#math-adventure .ma-field input,#math-adventure .ma-field select,#math-adventure .ma-field textarea{font-family:inherit;font-size:18px;line-height:1.5}

#math-adventure .ma-answer-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}

const FLOW_NAMES=['动手看懂','讲清关系','原题重做','举一反三','隔天再试'];
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function recordFor(id=s.lesson){return s.records[id]||(s.records[id]={game:false,bridge:false,checks:{},finishedDay:null,reviews:[]});}
function cleanChallenge(){return {answers:[],reason:'',attempts:0,hints:0,passed:false,feedback:'',type:'',assisted:false,firstTry:false,note:''};}
function reviewTask(id,n){
 if(!n)return BANK[id].review;
 const a=n+4;
 if(id==='juice')return task(`一桶饮料的2/5是${a*20}毫升。整桶多少毫升？`,rel('已知量对应几份？','2份','5份','3份'),[field('整桶',a*50,'毫升')],['先找已知量对应的份数。','2份已知，整桶5份。','先除以2求1份，再乘5。'],`${a*20}÷2×5＝${a*50}毫升。`);
 if(id==='cookies')return task(`姐姐的贴纸比妹妹多1/2。姐姐有${a*3}张，妹妹有多少张？`,rel('完整的2份是谁？','妹妹','姐姐','两人合计'),[field('妹妹',a*2,'张')],['找“比谁多”里的谁。','妹妹2份，姐姐3份。','已知姐姐3份，先求1份。'],`${a*3}÷3×2＝${a*2}张。`);
 if(id==='factory')return task(`甲乙丙按2∶3∶5混合，各有${a*30}千克，乙用完。甲剩多少？丙需补多少？`,rel('已知库存对应乙的几份？','3份','10份','5份'),[field('甲剩余',a*10,'千克'),field('丙需补',a*20,'千克')],['先锁定乙。','乙3份，用库存除以3。','计算甲用2份、丙用5份，再与库存比较。'],`每份${a*10}；甲剩${a*10}，丙补${a*20}。`);
 if(id==='cake')return task(`三角形与梯形面积比1∶${a}。从长方形左上角连到底边，三角形底边占整条底边多少？`,rel('三角形占整个长方形多少？',`1/${a+1}`,`1/${a}`,`2/${a+1}`),[field('底边占比',2/(a+1),'','fraction')],['总份数要相加。','三角形占总面积的1份。','底边占比是面积占比的2倍。'],`底边占2/${a+1}。`);
 if(id==='salt')return task(`糖∶水原来1∶4，加入${a*2}克糖后，糖占糖水1/3。原糖水多少克？`,rel('不变的是？','水','糖','糖水'),[field('原糖水',a*10,'克')],['后来糖∶水＝1∶2。','同样4份水，原糖1份，后来糖2份。','新加的糖恰好1份；原糖水共5份。'],`${a*2}×5＝${a*10}克。`);

function taskFor(){return s.exam==='review'?reviewTask(s.lesson,s.reviewSerial||0):BANK[s.lesson][s.exam];}
function taskLabel(){const r=recordFor();return {original:BANK[s.lesson].original.source||'原题重做',near:'变式一 · 换数字',far:'变式二 · 换问法 / 情境',review:r.finishedDay&&today()>r.finishedDay?'隔天再试 · 新题':'同日加练 · 新题'}[s.exam];}
function flowIndex(){return s.mode==='play'?0:s.mode==='bridge'?1:s.mode==='exam'?(s.exam==='original'?2:s.exam==='review'?4:3):4;}
function flowRail(){return `<nav class="ma-route" aria-label="学习路径，可自由选择">${FLOW_NAMES.map((x,i)=>`<button type="button" data-flow="${i}" ${i===flowIndex()?'aria-current="step"':''}><b>${i+1}</b><span>${x}</span></button>`).join('')}</nav><p class="ma-route-tip">想从哪一步开始？点上面的数字就能跳转。</p>`;}
function statusText(id){const r=s.records[id];if(!r)return '从这里出发';const n=['original','near','far'].filter(k=>r.checks[k]?.independent).length;if(r.reviews.some(x=>x.independent&&x.delayed))return '隔天新题独立完成';if(r.finishedDay)return `${n}/3题独立 · 待复习`;if(r.bridge)return '已完成关系练习';if(r.game)return '动手已完成';return '继续学习';}
function startExam(kind,resume=false){rememberView();const cached=resume&&navMemory().exams[kind];s.exam=kind;s.mode='exam';if(cached)Object.assign(s,navCopy(cached));else{s.examState=cleanChallenge();if(kind==='review'){const r=recordFor();s.reviewSerial=r.reviewSerial||0;r.reviewSerial=s.reviewSerial+1;}}stopSpeech();render();save();topOfTask();}
function normalizedNumber(value){const t=String(value).trim().normalize('NFKC').replaceAll('：',':').replaceAll('∶',':').replaceAll('／','/').replace(/\s/g,'');if(!t)return null;if(/^-?\d+(?:\.\d+)?%$/.test(t))return Number(t.slice(0,-1))/100;if(/^-?\d+(?:\.\d+)?$/.test(t))return Number(t);const m=t.match(/^(-?\d+(?:\.\d+)?)[/:](-?\d+(?:\.\d+)?)$/);if(m&&Number(m[2])!==0)return Number(m[1])/Number(m[2]);return null;}
function normalizedOrder(x){return String(x).normalize('NFKC').replace(/\s/g,'').toLowerCase();}
function fieldOK(value,f){if(f.type==='order')return normalizedOrder(value)===f.answer;const n=normalizedNumber(value);return n!==null&&Math.abs(n-f.answer)<1e-8;}
function submitExam(){const t=taskFor(),e=s.examState;
 if(e.passed)return;
 if(e.reason===''||t.fields.some((f,i)=>!String(e.answers[i]||'').trim())){e.feedback='先选清关系，再把每个空填上。还没填写的不算答错。';e.type='incomplete';render();return;}
 e.attempts++;
 const wrongRelation=Number(e.reason)!==t.relation.correct;
 const wrongFields=t.fields.map((f,i)=>fieldOK(e.answers[i],f)?null:f.label).filter(Boolean);
 if(wrongRelation||wrongFields.length){e.assisted=true;e.type=wrongRelation?'relation':'calculation';e.feedback=wrongRelation?'先修正数量关系。算出的数字即使碰巧正确，也还不能通过这一题。':`关系找对了，再检查“${wrongFields.join('、')}”。先核对它对应几份，以及问的是全部、剩余还是新增。`;render();save();return;}
 e.passed=true;e.type='passed';e.firstTry=e.attempts===1&&e.hints===0&&!e.assisted;e.feedback=e.firstTry?'这次你独立找对关系，也算对了。':'这次已经订正正确。因为使用了帮助或重试，我们把它记为“帮助后完成”。';
 const result={independent:e.firstTry,attempts:e.attempts,hints:e.hints,visualHelp:!!e.visualHelp,day:today(),answers:e.answers.map(x=>String(x).slice(0,40)),reason:Number(e.reason)};
 const r=recordFor();
 if(s.exam==='review'){result.delayed=!!r.finishedDay&&today()>r.finishedDay;r.reviews.push(result);r.reviews=r.reviews.slice(-2);}
 else {r.checks[s.exam]=result;if(!r.finishedDay&&['original','near','far'].every(k=>r.checks[k]))r.finishedDay=today();}
 render();save();
}
function figureFor(t){if(!t.figure)return '';if(t.figure==='fold'){const [w,a]=t.paper,h=w-a,scale=180/w,X=n=>50+n*scale,Y=n=>15+n*scale;return svg(280,200,'原题折纸示意，未标辅助格与答案',`<rect x="50" y="15" width="180" height="${h*scale}" fill="#fff" stroke="#8a9b85" stroke-dasharray="4 4"/><rect x="50" y="15" width="${a*scale}" height="${(h-a)*scale}" fill="#a5d3b0"/><polygon points="${X(a)},15 ${X(a)},${Y(h)} ${X(w)},${Y(h)}" fill="#f1d39d" stroke="#8a9b85"/><polygon points="50,${Y(h-a)} ${X(a)},${Y(h-a)} ${X(a)},${Y(h)}" fill="#d0be8a" stroke="#8a9b85"/>`);}
 return svg(280,155,'原题长方形，A在左上角，底边从左下角量起',`<rect x="20" y="25" width="240" height="100" fill="#fff" stroke="#6e8c7b" stroke-width="2"/>${txt(20,18,'A')}${t.figure==='quarter'?'<line x1="20" y1="25" x2="80" y2="125" stroke="#587f6f" stroke-width="2"/>':''}${txt(20,147,'左端','start')}${txt(260,147,'右端','end')}`);
}
function optionOrder(items){const shift=(lessons.findIndex(l=>l.id===s.lesson)+(['original','near','far','review'].indexOf(s.exam)+1))%items.length;return items.map((text,index)=>({text,index})).slice(shift).concat(items.map((text,index)=>({text,index})).slice(0,shift));}
function assessmentView(){const t=taskFor(),e=s.examState;
return `<main class="ma-main">${flowRail()}<div class="ma-kicker">${lesson().icon} ${lesson().name}</div><h1>${taskLabel()}</h1><p class="ma-exam-intro">先自己想一想。需要时再点帮助。</p>${t.notice?`<p class="ma-notice">${t.notice}</p>`:''}<section class="ma-paper"><p>${t.body}</p>${figureFor(t)}</section><form id="ma-exam-form"><label class="ma-field"><span>先找关系：${t.relation.prompt}</span><select id="ma-reason" ${e.passed?'disabled':''}><option value="">请选择</option>${optionOrder(t.relation.options).map(({text:v,index:i})=>`<option value="${i}" ${String(e.reason)===String(i)?'selected':''}>${v}</option>`).join('')}</select></label><div class="ma-answer-fields">${t.fields.map((f,i)=>`<label class="ma-field"><span>${f.label}${f.unit?'（'+f.unit+'）':''}</span><input type="text" inputmode="${f.type==='number'?'decimal':'text'}" maxlength="40" data-answer="${i}" value="${escape(e.answers[i]||'')}" placeholder="${f.type==='fraction'?'例如 2/5':f.type==='ratio'?'例如 2:3':f.type==='order'?'例如 a>b>c':'填数字'}" autocomplete="off" ${e.passed?'disabled':''}></label>`).join('')}</div><label class="ma-field"><span>我为什么这样做？（可说给大人听，也可写一句）</span><textarea id="ma-explain" rows="2" maxlength="160" placeholder="先找……因为……" ${e.passed?'disabled':''}>${escape(e.note||'')}</textarea></label><p class="ma-caption">这句解释留给孩子与大人讨论，不由程序自动判断。</p>${!e.passed?'<button class="ma-primary" type="submit">检查关系和答案</button>':''}</form><div aria-live="polite">${e.feedback?`<div class="ma-feedback ${e.passed?'success':''}">${escape(e.feedback)}</div>`:''}</div>${e.hints?`<aside class="ma-repair"><strong>只补这一小步 · ${e.hints}/3</strong><p>${t.hints[e.hints-1]}</p><p class="ma-caption">保留你填的内容，想清楚后再检查。</p></aside>`:''}<div class="ma-footer">${e.passed?`<details class="ma-solution"><summary>核对完整过程</summary><p>${t.solution}</p></details>`:`<button type="button" class="ma-secondary" data-path="help" ${e.hints>=3?'disabled':''}>${e.hints?'再给一点帮助':'我需要一点帮助'}</button>`}${e.passed?'<button type="button" class="ma-primary" data-path="continue">继续下一步 →</button>':''}</div></main>`;
}
function bridgeView(){const b=BANK[s.lesson].bridge;return `<main class="ma-main">${flowRail()}<div class="ma-kicker">把游戏里的发现，带回数学题</div><h1>这一步，轮到你解释</h1><div class="ma-bridge"><p>🎮 ${b[0]}</p><span>↓</span><p>✏️ ${b[1]}</p></div><p class="ma-question">${b[2]}</p><div class="ma-choices">${optionOrder([b[4],b[3],b[5]]).map(({text:x,index:i})=>`<button class="ma-choice ${s.bridgeChoice===i?(s.bridgePassed?'right':'try'):''}" data-bridge="${i}" type="button" ${s.bridgePassed?'disabled':''}>${x}</button>`).join('')}</div><div aria-live="polite">${s.bridgeFeedback?`<p class="ma-feedback ${s.bridgePassed?'success':''}">${s.bridgeFeedback}</p>`:''}</div><div class="ma-footer"><button type="button" class="ma-secondary" data-path="backGame">回去动手看一遍</button><button type="button" class="ma-primary" data-path="startOriginal" ${s.bridgePassed?'':'disabled'}>收起图解，我来做题 →</button></div></main>`;}

function pathAction(key){
if(key==='record'){rememberView();s.mode='records';render();save();topOfTask();}
if(key==='startOriginal')startExam('original',true);
if(key==='help'&&!s.examState.passed){s.examState.hints=Math.min(3,s.examState.hints+1);s.examState.assisted=true;render();save();}
if(key==='continue'&&s.examState.passed){if(s.exam==='original')startExam('near',true);else if(s.exam==='near')startExam('far',true);else{rememberView();s.mode='summary';render();save();topOfTask();}}

if(key==='backGame')goFlow(0);
}

else if(s.mode==='exam')root.innerHTML=header()+assessmentView();

else if(s.mode==='play'&&STORY_META[s.lesson])root.innerHTML=header()+storyView();

attachVisualLesson();

function picnicOrange(x,y,r=12){return `<g class="picnic-orange"><circle cx="${x}" cy="${y}" r="${r}" fill="#f5a338" stroke="#d88624" stroke-width="1.5"/><path d="M${x},${y-r+2} q-3,-10 8,-8 q0,8 -8,8" fill="#548d53"/><path d="M${x-r/2},${y-r/3} q-3,3 -2,6" fill="none" stroke="#ffda94" stroke-width="2.5" stroke-linecap="round"/></g>`;}
function picnicBag(n,flat=false){const positions=[[55,87],[103,87],[55,118],[103,118],[55,149],[103,149]];
return `<svg viewBox="0 0 160 180" aria-hidden="true" focusable="false" class="picnic-bag-svg">${flat?'<rect x="22" y="36" width="116" height="137" rx="10" fill="#fff8e9" stroke="#bd955e" stroke-width="3"/>':'<path d="M54 63 V40 C54 8 106 8 106 40 V63" fill="none" stroke="#a97b40" stroke-width="8"/><path d="M27 51 H133 L142 169 Q80 181 18 169 Z" fill="#f3d9ac" stroke="#b58a53" stroke-width="3"/><path d="M27 51 L39 66 H121 L133 51" fill="none" stroke="#d5b47e" stroke-width="2"/>'}${n===null?'<text x="80" y="123" text-anchor="middle" font-size="42" fill="#936d36">?</text>':positions.slice(0,n).map(([x,y])=>picnicOrange(x,y)).join('')}${n===0?'<path d="M66 112 H94 M80 98 V126" stroke="#a9824b" stroke-width="4" stroke-linecap="round"/>':''}</svg>`;}
function picnicCard(i,n,{interactive=false,remove=false,flat=false,intro=false}={}){const pals=['🐻','🐰','🐼','🐨','🐯','🐸','🐱','🐶'];const known=i<3;const label=intro?'每人一袋':flat?`第${i+1}份`:`第${i+1}袋`;
const content=`<span class="picnic-pal" aria-hidden="true">${flat?'':pals[i]}</span>${picnicBag(n,flat)}<span class="picnic-card-label">${label}</span>${!intro?`<span class="picnic-card-count" aria-label="${n}个橘子">${n}个</span>`:''}`;
return `<div class="picnic-card ${known?'picnic-known':''} ${intro?'picnic-intro-card':''}">${interactive?`<button type="button" class="picnic-bag-button" data-picnic-bag="${i}" aria-label="给第${i+1}袋放${s.step===1?'1':'2'}个橘子" ${s.passed||(s.step===1?s.v.oranges.reduce((a,b)=>a+b,0)>=6:n>0)?'disabled':''}>${content}</button>`:`<div class="picnic-bag-static">${content}</div>`}${remove?`<button type="button" class="picnic-take" data-picnic-take="${i}" aria-label="从第${i+1}袋拿回1个橘子" ${n===0||s.passed?'disabled':''}>拿回1个</button>`:''}</div>`;
}
function picnicScene(){const v=s.v,k=s.step;
if(k===0)return `<section class="picnic-world" aria-label="8位小伙伴，每人一袋橘子"><div class="picnic-scene-heading">一人一袋，每袋一样多</div><div class="picnic-eight">${Array.from({length:8},(_,i)=>picnicCard(i,null,{intro:true})).join('')}</div><p class="picnic-scene-note">任务：帮小狐狸把8袋橘子备齐。</p></section>`;
if(k===1){const left=6-v.oranges.reduce((a,b)=>a+b,0);return `<section class="picnic-world" aria-label="把6个橘子平均分给3位小伙伴"><div class="picnic-basket"><strong>${left?'桌上还剩'+left+'个橘子':'6个橘子都放进袋子了'}</strong><div class="picnic-loose" aria-hidden="true">${Array.from({length:6},(_,i)=>`<svg viewBox="0 0 40 44" class="${i>=left?'picnic-empty-orange':''}">${picnicOrange(20,25,14)}</svg>`).join('')}</div></div><p class="picnic-instruction">${config().question}</p><div class="picnic-three">${v.oranges.map((n,i)=>picnicCard(i,n,{interactive:true,remove:true})).join('')}</div></section><div class="picnic-check"><button type="button" class="ma-secondary" data-picnic="check" ${s.passed?'disabled':''}>检查：每人一样多了吗？</button></div>`;}
if(k===2)return `<section class="picnic-world" aria-label="给另外5位也装上2个橘子"><p class="picnic-instruction">${config().question}</p><div class="picnic-eight">${Array.from({length:8},(_,i)=>picnicCard(i,i<3||v.picnicFilled.includes(i)?2:0,{interactive:i>=3})).join('')}</div><p class="picnic-scene-note">已经装好${3+v.picnicFilled.length}袋，还剩${5-v.picnicFilled.length}袋</p></section>`;
if(k===3)return `<section class="picnic-world" aria-label="8个袋子，每袋2个橘子"><div class="picnic-eight">${Array.from({length:8},(_,i)=>picnicCard(i,2)).join('')}</div></section><form id="picnic-total" class="picnic-total"><label for="picnic-answer">一共</label><input id="picnic-answer" inputmode="numeric" type="text" maxlength="3" value="${escape(v.picnicAnswer)}" aria-label="一共有多少个橘子" ${s.passed?'disabled':''}><span>个橘子</span><button class="ma-secondary" type="submit" ${s.passed?'disabled':''}>检查答案</button></form>${s.passed?'<div class="picnic-equations"><span>6个 ÷ 3袋 = 每袋2个</span><span>每袋2个 × 8袋 = 16个</span></div>':''}`;
return `<section class="picnic-world" aria-label="从8袋橘子变成8等份"><div class="picnic-scene-heading">${v.picnicFlat?'1袋 → 1份，橘子的数量没变':'一袋橘子，就是一份'}</div><div class="picnic-eight picnic-fraction-view">${Array.from({length:8},(_,i)=>picnicCard(i,2,{flat:v.picnicFlat})).join('')}</div><div class="picnic-legend"><span>橙色标记：前3${v.picnicFlat?'份':'袋'}，共6个</span><span>全部：8${v.picnicFlat?'份':'袋'}，共16个</span></div>${v.picnicFlat?'<p class="picnic-fraction-sentence">前3份，是全部8份中的3份。<br>写成分数，就是 <strong>3/8</strong>。</p>':'<button class="ma-secondary" data-picnic="flatten" type="button">把每袋画成一份 →</button>'}</section>${v.picnicFlat?`<p class="ma-question">${config().question}</p><div class="ma-choices">${config().choices.map((a,i)=>`<button type="button" class="ma-choice ${s.selected===i?(s.passed?'right':'try'):''}" data-choice="${i}" ${s.passed?'disabled':''}>${a.label}</button>`).join('')}</div>`:''}`;
}
function picnicView(){const c=config(),labels=['认识任务','分好3袋','备齐8袋','数出全部','认识分数'],next=['看看已经准备好的橘子 →','给另外5位装袋 →','数数一共有多少 →','把故事变成分数题 →','把发现带回题目 →'];return `<main class="ma-main picnic-main"><div class="picnic-progress" aria-label="动手看懂，第${s.step+1}步，共5步"><span>🍊 野餐分橘子</span><span>第${s.step+1}步 · ${labels[s.step]}</span></div><h1>${c.title}</h1><div class="picnic-story"><span aria-hidden="true">🦊</span><p>${s.step===0?'明天，8位小伙伴要去野餐。<br>每人一袋橘子，<strong>每袋一样多。</strong>':c.line}</p></div>${picnicScene()}<div aria-live="polite">${s.feedback?`<div class="ma-feedback ${s.passed?'success':''}">${escape(s.feedback)}</div>`:''}${s.hint&&!s.passed?`<div class="ma-feedback">${c.hint}</div>`:''}</div><div class="ma-footer picnic-footer"><div>${s.step>0?'<button class="ma-link" type="button" data-act="hint">给我一点提示</button>':''}${'speechSynthesis' in window?'<button class="ma-link" type="button" data-act="speak">🔊 读给我听</button>':''}</div><button type="button" class="ma-primary" ${s.step===0?'data-picnic="start"':'data-act="next"'} ${s.step===0||s.passed?'':'disabled'}>${next[s.step]}</button></div></main>`;}
function picnicCheck(){if(s.step!==1||s.passed)return;const a=s.v.oranges,total=a.reduce((x,y)=>x+y,0);if(total!==6)s.feedback=`桌上还有${6-total}个橘子，先把它们分完。`;else if(a.every(n=>n===2))pass('每人都分到2个！6个橘子平均分给3位，每袋就是2个。');else s.feedback=`现在三袋分别有${a.join('、')}个，还不一样多。用“拿回1个”调整，再分一分。`;render();save();}
function picnicTotal(){if(s.step!==3||s.passed)return;const n=normalizedNumber(s.v.picnicAnswer);if(n===16)pass('备齐啦！8袋，每袋2个，一共需要16个橘子。');else if(n===6)s.feedback='6个是前3袋的橘子。还要把后面5袋也数上。';else if(n===10)s.feedback='10个是后来装的5袋。前3袋的6个也要算进去。';else s.feedback='每袋有2个，一共有8袋。你可以两个两个数。';render();save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||s.lesson!=='juice'||s.mode!=='play')return;
if(b.dataset.picnic==='start'){pass('');action('next');return;}
if(b.dataset.picnic==='check'){picnicCheck();return;}
if(b.dataset.picnic==='flatten'){s.v.picnicFlat=true;render();save();return;}
if(b.dataset.picnicBag!==undefined&&!s.passed){const i=Number(b.dataset.picnicBag);if(s.step===1&&i<3&&s.v.oranges.reduce((a,b)=>a+b,0)<6){s.v.oranges[i]++;s.feedback='';}if(s.step===2&&i>=3&&i<8&&!s.v.picnicFilled.includes(i)){s.v.picnicFilled.push(i);if(s.v.picnicFilled.length===5)pass('8袋都装好了，每袋都有2个橘子。');}render();save();}
if(b.dataset.picnicTake!==undefined&&s.step===1&&!s.passed){const i=Number(b.dataset.picnicTake);if(s.v.oranges[i]>0)s.v.oranges[i]--;s.feedback='';render();save();}
});
root.addEventListener('input',e=>{if(e.target.id==='picnic-answer'){s.v.picnicAnswer=e.target.value;save();}});
root.addEventListener('submit',e=>{if(e.target.id==='picnic-total'){e.preventDefault();picnicTotal();}});

function storyAnswer(value){if(s.passed)return;const k=s.step,v=storyState();
if(s.lesson==='cookies'&&k===2&&v.groups){if(value==='third')pass('差2块，是兔兔6块的1/3。换了比较对象，分数也跟着变了。');else storyFail('现在跟兔兔的6块比。把6块每2块分组，差的是3组中的1组。');}
if(s.lesson==='cake'&&k===2&&v.copy){if(value==='eighth')pass('两块相同三角形才占1/4，一块就是1/8。底边取1/4，面积不会直接也是1/4。');else storyFail('1/4是三角形和纸片两块合起来。单独一块要再分成一半。');}
if(s.lesson==='salt'&&k===1&&v.added){if(value==='water')pass('只有水的质量没变。接下来用同样多的水，比较前后的盐。');else storyFail(value==='salt'?'盐新加了15克，已经变多。':'盐水包括水和盐，加进盐后总质量也增加了。');}
if(s.lesson==='race'&&k===1&&v.split){if(value==='red')pass('红车1小时走4千米，蓝车走3千米。红车就是快车，蓝车是慢车。');else storyFail('比较表示1小时的红、蓝长段。红车一段4千米，比蓝车一段3千米长。');}
if(s.lesson==='fold'&&k===1&&v.first){if(value==='equal')pass('右边折到下边，边长保持不变。右侧这块宽和高一样，原纸整体仍是长方形。');else storyFail('只看右侧由橙色边围出的那一块。原纸还包括左边的窄条。');}
if(s.lesson==='machines'&&k===5&&(v.common||1)>1){if(value==='same')pass('四个输入按同一倍数变大，顺序仍是a＞d＞c＞b。共同结果取1只是为了算起来方便。');else storyFail('各张输入卡都乘了同一个正数。一起放大，不会互相交换大小。');}
storyUpdate();
}
function storyCheck(){if(s.passed)return;const id=s.lesson,k=s.step,v=storyState();const specs={
 'cookies:3':[['writing',18],'写字用3份，每份6次，共18次。'],
 'cookies:4':[['reading',15],'18÷6＝3次一份。看书5份，共15次。'],
 'cookies:5':[['gaming',10],'看书3份15次，1份5次；游戏2份是10次。多出的一半按游戏算。'],
 'factory:3':[['left',2],['extra',4],'红珠剩2颗，蓝珠补4颗。剩下的和新补的，分别按各自的盒子算。'],
 'factory:4':[['unit',200],'600吨对应黄沙3份，每份600÷3＝200吨。再用同样的一份去算其他材料。'],
 'cake:4':[['rabbit',3/4],'小熊1/4，小兔3/4，两块面积比1∶3。切点落在底边中点。'],
 'salt:3':[['added',3],'后来11格减原来8格，多出来3格，正好对应新增15克。'],
 'salt:5':[['original',480],'原来88＋8＝96格，每格5克，共480克。新增15克不算在原来里面。'],
 'race:2':[['fast',4],['slow',3],'同样1小时，快车4千米，慢车3千米。'],
 'race:3':[['time',4/3],'慢∶快的时间是8∶6＝4∶3。'],
 'race:4':[['speed',4/3],'快∶慢的速度是4∶3。两问答案碰巧相同，但名字顺序和比较的量不同。'],
 'fold:2':[['height',5],'右侧宽7－2＝5格。它是正方形，所以原纸高5格。'],
 'fold:3':[['shadeHeight',3],'绿色区域高5－2＝3格，宽仍是2格。'],
 'fold:5':[['whole',35],['fraction',6/35],'阴影6格，原纸7×5＝35格，所以占6/35。'],
 'book:2':[['pagesPart',100],['pagesWhole',300],'每段200÷2＝100页，全书100×3＝300页。'],
 'book:5':[['total',9],['remaining',3],'一共6＋3＝9天；还要只算接下来的3天。'],
 'machines:3':[['d',1],'2÷(2/d)会数回d份。结果要1，d就等于1。']
};const spec=specs[`${id}:${k}`];if(!spec)return;const fields=spec.slice(0,-1);if(fields.some(([key])=>!stInput(key).trim())){storyFail('先把这一小步的空填上，再检查。');storyUpdate();return;}
const ok=fields.every(([key,answer])=>{const n=normalizedNumber(stInput(key));return n!==null&&Math.abs(n-answer)<1e-8;});
if(ok)pass(spec[spec.length-1]);else{let message=config().hint;
 if(id==='cookies'&&k===3)message='写字占4份中的3份，每份6次。只把选中的3份合起来。';
 if(id==='cookies'&&k===4)message='18是写字的6份，不是正常的24次。先用18÷6，再取5份。';
 if(id==='cookies'&&k===5)message='“多一半”以游戏为准。游戏2份，看书3份，不能直接拿15减去它自己的一半。';
 if(id==='salt'&&k===5)message='原来只有88格水和8格盐。检查是否把新增的3格也算进了“原来”。';
 if(id==='race'&&k===3)message='时间比按“慢车在前、快车在后”，先写8∶6，再化简。';
 if(id==='race'&&k===4)message='速度比按“快车在前、慢车在后”，写同样1小时走的4千米与3千米。';
 if(id==='book'&&k===5)message='两问分开：一共从第1天数，还要从第7天数。';
 storyFail(message);}
storyUpdate();
}

root.addEventListener('input',e=>{if(e.target.dataset.storyInput!==undefined){const v=storyState();v.inputs=v.inputs||{};v.inputs[`${s.step}:${e.target.dataset.storyInput}`]=e.target.value;s.feedback='';root.querySelector('[aria-live=polite]').innerHTML='';save();}if(e.target.id==='story-cut'){const foot=Number(e.target.value);storyState().foot=foot;s.feedback='';const holder=document.createElement('div');holder.innerHTML=cakeDiagram(foot,true);root.querySelector('.st-world .ma-svg').replaceWith(holder.firstElementChild);root.querySelector('#story-cut-value').textContent='切点在底边的'+foot+'%。';root.querySelector('[aria-live=polite]').innerHTML='';save();}});

// Navigation changes location, never awards a pass or clears an attempt.
function navMemory(){
 if(!s.navigation||typeof s.navigation!=='object')s.navigation={};
 return s.navigation[s.lesson]||(s.navigation[s.lesson]={steps:{},exams:{}});
}
const navCopy=value=>JSON.parse(JSON.stringify(value));
function rememberView(){
 const n=navMemory();
 if(s.mode==='play'){
  const view=navCopy({step:s.step,v:s.v,passed:s.passed,feedback:s.feedback,selected:s.selected,wrong:s.wrong,hint:s.hint});
  n.play=view;n.steps[s.step]=view;
 }else if(s.mode==='bridge')n.bridge={bridgePassed:s.bridgePassed,bridgeChoice:s.bridgeChoice,bridgeFeedback:s.bridgeFeedback};
 else if(s.mode==='exam')n.exams[s.exam]=navCopy({examState:s.examState,reviewSerial:s.reviewSerial||0});
}
function newGameView(step){
 const v=initial().v;
 // Prepare only the scene's starting conditions, not this step's answer.
 if(s.lesson==='factory'&&step===2)v.story={made:1};
 if(s.lesson==='factory'&&step===3)v.story={made:2,blueExtra:4};
 return {step,v,passed:false,feedback:'',selected:null,wrong:0,hint:false};
}
function resumeGame(){
 const n=navMemory();Object.assign(s,n.play?navCopy(n.play):newGameView(0),{mode:'play'});
}
function navigationDone(){stopSpeech();render();save();topOfTask();}
function goGameStep(step){
 if(!Number.isInteger(step)||step<0||step>=pages()[s.lesson].length)return;
 rememberView();const n=navMemory();
 Object.assign(s,n.steps[step]?navCopy(n.steps[step]):newGameView(step),{mode:'play'});
 navigationDone();
}
function goFlow(index){
 if(!Number.isInteger(index)||index<0||index>4)return;
 rememberView();
 if(index===0)resumeGame();
 else if(index===1){Object.assign(s,navMemory().bridge||{bridgePassed:false,bridgeChoice:null,bridgeFeedback:''});s.mode='bridge';}
 else {startExam(index===2?'original':index===3?'near':'review',true);return;}
 navigationDone();
}
function advanceGame(){
 rememberView();
 if(s.step<pages()[s.lesson].length-1){goGameStep(s.step+1);return;}
 const n=navMemory();
 if(pages()[s.lesson].every((_,i)=>n.steps[i]?.passed))recordFor().game=true;
 goFlow(1);
}
function skipCurrent(){
 if(s.mode==='play'){if(s.step<pages()[s.lesson].length-1)goGameStep(s.step+1);else goFlow(1);}
 else if(s.mode==='bridge')goFlow(2);
 else if(s.mode==='exam'){
  if(s.exam==='original')startExam('near',true);
  else if(s.exam==='near')startExam('far',true);
  else if(s.exam==='far')goFlow(4);
  else {rememberView();s.mode='summary';navigationDone();}
 }
}
function gameStepRail(){return `<div class="ma-free-steps"><p>动手小步骤 · 点数字可以自由选择</p><nav class="ma-step-buttons" aria-label="动手小步骤">${pages()[s.lesson].map((p,i)=>`<button type="button" data-game-step="${i}" aria-label="小步骤 ${i+1}：${escape(p.title)}" title="${escape(p.title)}" ${s.step===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav></div>`;}
function variantRail(){return `<nav class="ma-variant-tabs" aria-label="选择变式题"><button type="button" data-exam-tab="near" ${s.exam==='near'?'aria-current="page"':''}>变式一 · 换数字</button><button type="button" data-exam-tab="far" ${s.exam==='far'?'aria-current="page"':''}>变式二 · 换问法</button></nav>`;}
function freeNavigation(){
 if(!['play','bridge','exam','summary'].includes(s.mode))return;
 const main=root.querySelector('.ma-main');if(!main)return;
 if(s.mode==='play')main.insertAdjacentHTML('afterbegin',flowRail()+gameStepRail());
 if(s.mode==='exam'&&['near','far'].includes(s.exam))root.querySelector('h1')?.insertAdjacentHTML('afterend',variantRail());
 if(s.mode!=='summary'){
  const label=s.mode==='play'?'跳过这小步 →':s.mode==='bridge'?'跳过讲解，直接做题 →':s.exam==='review'?'暂不做，查看记录 →':'跳过这道题 →';
  main.insertAdjacentHTML('beforeend',`<div class="ma-free-footer"><span>可以随时回来；跳过不会记作完成。</span><button type="button" class="ma-secondary" data-skip-current>${label}</button></div>`);
 }
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.flow!==undefined)goFlow(Number(b.dataset.flow));
 else if(b.dataset.gameStep!==undefined)goGameStep(Number(b.dataset.gameStep));
 else if(b.dataset.examTab==='near'||b.dataset.examTab==='far')startExam(b.dataset.examTab,true);
 else if(b.hasAttribute('data-skip-current'))skipCurrent();
});

let visualTimer=null,visualPlaying=false,visualMotionPaused=false;
function visualContext(){
 if(s.mode==='foundation'){const f=fdState();if(f.phase!==0)return null;const frames=FD[f.id].frames(),key='foundation:'+f.id;if(!s.visuals)s.visuals={};const memory=s.visuals[key]||(s.visuals[key]={frame:0,open:true});memory.frame=Math.min(Math.max(0,memory.frame||0),frames.length-1);return {key,kind:'story',frames,memory};}
 if(!['play','bridge','exam'].includes(s.mode))return null;
 const kind=s.mode==='play'?((s.lesson==='cookies'&&s.step>=3)||(s.lesson==='factory'&&s.step>=4)?'original':'story'):s.mode==='bridge'?'original':s.exam;
 const startFrames={juice:[0,2,3,4,5],cookies:[0,2,3,1,2,3],factory:[0,1,2,3,2],cake:[0,0,1,2,3],salt:[0,0,1,2,4,5],race:[0,1,1,3,4],fold:[0,1,2,3,4,5],book:[0,0,1,3,4,5],machines:[0,1,2,4,5,6]};
 const key=[s.lesson,s.mode,kind,s.mode==='play'?s.step:kind==='review'?s.reviewSerial||0:0].join(':');
 const frames=visualFrames(s.lesson,kind,s.reviewSerial||0);
 if(!s.visuals)s.visuals={};
 const memory=s.visuals[key]||(s.visuals[key]={frame:s.mode==='play'?startFrames[s.lesson]?.[s.step]||0:0,open:s.mode==='bridge'||s.mode==='play'&&s.step===0});
 memory.frame=Math.min(Math.max(0,memory.frame||0),frames.length-1);
 return {key,kind,frames,memory};
}
function stopVisualPlayback(){if(visualTimer!==null){clearTimeout(visualTimer);visualTimer=null;}visualPlaying=false;visualMotionPaused=false;}

function visualHeading(){return s.mode==='foundation'?'看一段故事，认清图里的东西':s.mode==='play'?'先看一段，再自己动手':s.mode==='bridge'?'把原题里的关系画出来':'这道题的分步图解';}
function visualMarkup(c){const f=c.frames[c.memory.frame],isExam=s.mode==='exam';return `<section class="vx-player ${c.memory.open?'':'vx-closed'}" aria-label="数学图解动画"><div class="vx-top"><div><span class="vx-kicker">会动的数学图解</span><h2>${visualHeading()}</h2></div><button class="ma-secondary" type="button" data-visual="toggle" aria-expanded="${c.memory.open}">${c.memory.open?'收起图解':'打开图解动画'}</button></div>${!c.memory.open?`<p class="vx-closed-note">${isExam?'可以先独立做；看过图解再答对，会记作“帮助后完成”。':'物品是什么、怎样变化、为什么这样算，一幅一幅看。'}</p>`:`<div class="vx-frame"><div class="vx-frame-title"><span>第 ${c.memory.frame+1} / ${c.frames.length} 幅</span><h3>${f.title}</h3></div><p class="vx-caption">${f.caption}</p><div class="vx-stage">${f.html}</div>${f.formula?`<div class="vx-formula"><span>把刚才的图写下来</span><strong>${f.formula}</strong></div>`:''}</div><div class="vx-controls"><button class="ma-secondary" type="button" data-visual="prev" ${c.memory.frame===0?'disabled':''}>← 上一幅</button><button class="ma-primary" type="button" data-visual="play">${visualPlaying?'Ⅱ 暂停':'▶ 播放动画'}</button><button class="ma-secondary" type="button" data-visual="next" ${c.memory.frame===c.frames.length-1?'disabled':''}>下一幅 →</button><button class="ma-link" type="button" data-visual="replay">↺ 从头重播</button></div><nav class="vx-seek" aria-label="自由选择图解画面">${c.frames.map((f,i)=>`<button type="button" data-visual-frame="${i}" aria-label="图解 ${i+1}：${f.title}" ${i===c.memory.frame?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav><p class="vx-player-tip">${visualPlaying?'正在播放，每幅停留8秒；随时可以暂停细看。':visualMotionPaused?'已暂停。点“播放动画”接着看，也可以直接选数字。':'不用赶，点“下一幅”慢慢看，也可以点数字跳着看。'}${isExam&&s.examState.visualHelp?' · 本题已使用图解帮助。':''}</p>`}</section>`;}
function attachVisualLesson(){
 const c=visualContext();if(!c||!c.frames.length)return;
 const target=root.querySelector(s.mode==='foundation'?'.fd-visual-anchor':s.mode==='play'?(s.lesson==='juice'?'.picnic-world':'.st-world'):s.mode==='bridge'?'.ma-bridge':'.ma-paper');
 if(!target)return;
 if(s.mode==='exam'&&c.memory.open&&!s.examState.passed){s.examState.assisted=true;s.examState.visualHelp=true;}
 target.insertAdjacentHTML(s.mode==='exam'?'afterend':'beforebegin',`<div id="ma-visual-slot">${visualMarkup(c)}</div>`);
 // The opening movie introduces the scene; later steps retain the actual toys.
 if((s.mode==='foundation'||s.mode==='play'&&s.step===0)&&typeof target.remove==='function')target.remove();
 settleVisualMotion();
}
function settleVisualMotion(){
 if(!visualReduced())return;
 // Under reduced motion every frame is still usable, showing the final diagram.
 const slot=root.querySelector('#ma-visual-slot');
 slot?.querySelectorAll?.('animate,animateTransform').forEach(a=>a.remove());
}
function drawVisual(){const c=visualContext(),slot=root.querySelector('#ma-visual-slot');if(!c||!slot)return;slot.innerHTML=visualMarkup(c);settleVisualMotion();save();}
function setVisualMotion(paused){
 const slot=root.querySelector('#ma-visual-slot');
 slot?.getAnimations?.({subtree:true}).forEach(a=>paused?a.pause():a.play());
 slot?.querySelectorAll?.('svg').forEach(svg=>paused?svg.pauseAnimations?.():svg.unpauseAnimations?.());
}
function visualButtonState(){const slot=root.querySelector('#ma-visual-slot'),b=slot?.querySelector?.('[data-visual="play"]'),tip=slot?.querySelector?.('.vx-player-tip');if(b)b.textContent=visualPlaying?'Ⅱ 暂停':'▶ 播放动画';if(tip)tip.textContent=visualPlaying?'正在播放，每幅停留8秒；随时可以暂停细看。':'已暂停。点“播放动画”接着看，也可以直接选数字。';}
function scheduleVisual(){
 const c=visualContext();if(!c||!visualPlaying||!c.memory.open)return;
 const key=c.key;
 visualTimer=setTimeout(()=>{visualTimer=null;const next=visualContext();if(!next||next.key!==key||!visualPlaying)return;if(next.memory.frame<next.frames.length-1){next.memory.frame++;drawVisual();scheduleVisual();}else{visualPlaying=false;visualButtonState();const tip=root.querySelector('.vx-player-tip');if(tip)tip.textContent='这一段看完了。可以重播，也可以回到题目自己试。';}},8000);
}
function visualAction(action,index){
 const c=visualContext();if(!c)return;
 if(action==='toggle'){
  stopVisualPlayback();c.memory.open=!c.memory.open;
  if(c.memory.open&&s.mode==='exam'&&!s.examState.passed){s.examState.assisted=true;s.examState.visualHelp=true;}
  drawVisual();if(c.memory.open)root.querySelector('.vx-frame-title')?.scrollIntoView?.({block:'start',behavior:'instant'});return;
 }
 if(!c.memory.open)return;
 if(action==='play'){
  if(visualPlaying){if(visualTimer!==null)clearTimeout(visualTimer);visualTimer=null;visualPlaying=false;visualMotionPaused=true;setVisualMotion(true);visualButtonState();}
  else{visualPlaying=true;if(visualMotionPaused){visualMotionPaused=false;setVisualMotion(false);visualButtonState();}else{if(c.memory.frame===c.frames.length-1)c.memory.frame=0;drawVisual();}scheduleVisual();}return;
 }
 stopVisualPlayback();
 if(action==='prev')c.memory.frame=Math.max(0,c.memory.frame-1);
 if(action==='next')c.memory.frame=Math.min(c.frames.length-1,c.memory.frame+1);
 if(action==='seek')c.memory.frame=Math.min(c.frames.length-1,Math.max(0,index));
 if(action==='replay'){c.memory.frame=0;visualPlaying=true;}
 drawVisual();root.querySelector('.vx-frame-title')?.scrollIntoView?.({block:'start',behavior:'instant'});if(visualPlaying)scheduleVisual();
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.visual)visualAction(b.dataset.visual);else if(b.dataset.visualFrame!==undefined)visualAction('seek',Number(b.dataset.visualFrame));});

function fdCut(cut=3){return `<div class="fd-chocolate" role="img" aria-label="同一块巧克力，左边${cut}小格，右边${8-cut}小格">${Array.from({length:8},(_,i)=>`<span class="${i===cut-1?'fd-cut-edge':''}"></span>`).join('')}</div><div class="fd-sides"><span>小熊：${cut}小格</span><span>小兔：${8-cut}小格</span></div><p class="vx-legend">整排是一块巧克力；每个小格同样大。绿线是切的位置。</p>`;}
function fdLine(d,n,max=1,buttons=false){const total=d*max;return `<div class="fd-number-line"><strong>从0出发。0到1这一段，才是一个单位。</strong><div class="fd-line-track"><span class="fd-line-progress" style="width:${n/total*100}%"></span>${Array.from({length:total+1},(_,i)=>buttons?`<button type="button" data-fd-mark="${i}" style="left:${i/total*100}%" aria-label="第${i}个位置，${fdF(i,d)}" ${i===n?'aria-pressed="true"':'aria-pressed="false"'}>${i%d===0?i/d:'●'}</button>`:`<span class="fd-tick ${i===n?'selected':''}" style="left:${i/total*100}%"><i></i><b>${i%d===0?i/d:i===n?fdF(i,d):''}</b></span>`).join('')}</div><p>把每个单位平均分${d}段，每走一小段是1/${d}。${buttons?'点一个位置，让小狐狸走过去。':''}</p></div>`;}
function fdArea(rows,cols,takeRows,takeCols){const selected=takeRows*takeCols;return `<div class="fd-area" style="--cols:${cols}" role="img" aria-label="整块平均分${rows*cols}格，先选上面${takeRows}行，再取其中左边${takeCols}列，最后选中${selected}格">${Array.from({length:rows*cols},(_,i)=>`<span class="${Math.floor(i/cols)<takeRows?(i%cols<takeCols?'both':'row'):'plain'} vx-pop"></span>`).join('')}</div><p class="vx-legend">整块＝1，共${rows*cols}个同样大的格。${takeRows?`先选上面${takeRows}行（所有彩色格）。${takeCols?`再只在这${takeRows}行里取左边${takeCols}列：绿色${selected}格是最后选中的部分。`:'下一步，只在橙色部分里继续选。'}`:'先认识整块，再开始选。'}</p>`;}

function fdSum(d,a,b,minus=false){const total=minus?a:a+b,whole=Math.max(1,Math.ceil(total/d));return `<div class="fd-strip-group"><strong>${minus?'先有的部分，划线部分要拿走':'橙色先有，蓝色新添'}</strong>${Array.from({length:whole},(_,w)=>`<div class="fd-strip" style="--parts:${d}">${Array.from({length:d},(_,i)=>{const k=w*d+i;return `<span class="${k>=total?'plain':minus?(k>=a-b?'gold fd-cross':'gold'):k<a?'gold':'blue'}">1/${d}</span>`;}).join('')}</div>`).join('')}<small>每一整条代表同样的1；小份的大小没有变。</small></div>`;}
function fdLesson(id,group,title,story,focus,prereq,frames,lab,questions){return {id,group,title,story,focus,prereq,frames,lab,questions};}
function fdQuestion(body,answer,good,bad1,bad2,explain,hint,figure='',label='我的答案',type='number',error='关系还要再看'){return {body,fields:answer===null?[]:[field(label,answer,'',type)],relation:rel('哪句话说明了你的想法？',good,bad1,bad2),explain,hint,figure,error};}

 ],{type:'unit',start:2,target:4,min:2,max:8,label:'一整根平均分成几份？',prompt:'把整根平均分成4份，只取其中1份。'},(slot,seed)=>{const d=seed%4+3;return slot===0?fdQuestion('涂色的一份占整根多少？',1/d,`整根平均分${d}份，取1份`,'把涂色和没涂色的数量相加','只看涂色是什么颜色',`一份是1/${d}。`,`先数整根平均分成几份。`,fdStrip(d,1),'占整根多少','fraction'):slot===1?fdQuestion(`1/${d}中的${d}告诉我们什么？`,null,`整个被平均分成${d}份`,`取了${d}份`,`整个有${d}件东西`,'分母告诉我们每份是怎样划出来的。','先说“把整个平均分成……”'):fdQuestion(`一条1米长的丝带平均剪成${d}段，每段几米？`,1/d,'把1米平均分，取其中一段',`${d}米是一段长`,'每段都是1米',`1米平均分${d}段，每段1/${d}米。`,'总长只有1米，每段应该比1米短。','','每段几米','fraction');}),

 line:fdLesson('line',1,'分数在数轴上有住址','小狐狸走一条路。起点是0，一个单位远的地方是1；分数告诉它走到哪里。','把分数放到路上，看看它离0有多远。',['build'],()=>[

 add:fdLesson('add',2,'同样的小份，合起来或拿走','两只小动物拿的都是同一大小的五分之一。合并时数份数，不重新切蛋糕。','合起来、拿走一些，每一小份会变大吗？',['build','over'],()=>[
  fdP('先确认每份一样大','橙色先有2个1/5，蓝色新添1个1/5。',fdSum(5,2,1)),
  fdP('一共3小份，仍然是五分之一','只是在数同样的小份，整条没有被重新分成10份。',fdStrip(5,3),'2/5 + 1/5 = 3/5'),
  fdP('减法就是拿走同样的小份','原来4个1/5，拿走1个，还剩3个。划线的部分不再计入。',fdSum(5,4,1,true),'4/5 − 1/5 = 3/5'),
  fdP('超过一条也可以继续数','4个1/5加3个1/5，共7个，能拼成1又2/5。',fdSum(5,4,3),'4/5 + 3/5 = 7/5')
 ],{type:'add',start:0,target:2,min:0,max:4,label:'再添几个1/5？',prompt:'先有2/5，再添到4/5。'},(slot,seed)=>{const d=seed%3+4;return slot===0?fdQuestion(`2/${d}+1/${d}是多少？`,3/d,'小份大小相同，只合并份数','分子分母都相加','只把分母加起来',`3个1/${d}就是3/${d}。`,'先读成“几个同样的小份”。',fdSum(d,2,1),'结果','fraction'):slot===1?fdQuestion(`${d-1}/${d}−1/${d}是多少？`,(d-2)/d,'拿走1份，剩下的每份大小不变','分母也减1','减法会让每一份变大',`还剩${d-2}个1/${d}。`,'只拿走一份，没有重新切整个。','','结果','fraction'):fdQuestion(`小熊上午走1/${d}千米，下午走2/${d}千米，一共几千米？`,3/d,'同样的长度单位可以合起来','两个分母相加','不同时间不能相加',`一共3/${d}千米。`,'两次的每一小段是同样长的吗？','','总路程','fraction');}),
 common:fdLesson('common',2,'小份不同，先换同一把尺','半张纸和三分之一张纸，各是1份，可是这两份不一样大。先换成同样的小格再合并。','半张加三分之一张，怎样一起数？',['equal','add'],()=>[
  fdP('都叫一份，大小却不同','两条代表同样大的整张纸。上面取一半，下面取三分之一。',fdStrip(2,1)+fdStrip(3,1,'同样大的另一张','blue')),
  fdP('用六分之一当共同的小份','一半可以分成3个1/6，三分之一可以分成2个1/6。',fdStrip(6,3)+fdStrip(6,2,'换成一样的小份','blue'),'1/2 = 3/6；1/3 = 2/6'),
  fdP('现在才可以数在一起','3个加2个，共5个六分之一。',fdSum(6,3,2),'1/2 + 1/3 = 5/6'),
  fdP('减法也先换成同样的小份','3/4里面拿走1/2，也就是拿走2个1/4，还剩1个。',fdSum(4,3,2,true),'3/4 − 1/2 = 1/4')
 ],{type:'common',start:3,target:6,min:2,max:12,label:'把每个整体统一分成几份？',prompt:'要同时表示1/2和1/3，找能整齐对齐的最少等份数。'},(slot,seed)=>{const [p,q]=[[2,3],[3,4],[4,6],[2,5]][seed%4],l=fdL(p,q);return slot===0?fdQuestion(`1/${p}+1/${q}是多少？`,1/p+1/q,'先把两种小份换成一样大','分子分母分别相加','都取一份所以答案是2',`换成${l}分之一，得到${fdF(l/p+l/q,l)}。`,`找${p}和${q}都能整齐分的等份数。`,'','结果','fraction'):slot===1?fdQuestion(`1−1/${p}是多少？`,(p-1)/p,`把1看作${p}个1/${p}`,'把分子分母同时减1','1不能写成分数',`1=${p}/${p}，拿走1份还剩${p-1}份。`,'先把完整的一条切成相同小份。','','结果','fraction'):fdQuestion(`同样的一米纸带，用掉1/${p}米，又用掉1/${q}米，共用几米？`,1/p+1/q,'两段长度用同样的小份测量后相加','把两段不同的小份当成相同份','先把两个分母相加',`总长为${fdF(l/p+l/q,l)}米。`,'先选一把两段都能量整齐的小尺。','','共用几米','fraction');}),
 of:fdLesson('of',2,'一盒东西的几分之几','一整盒有12颗糖。不是把一颗糖切碎，而是把整盒分成一样多的几组。','12颗糖的3/4，到底是几颗？',['whole','build'],()=>[
  fdP('整体可以是一盒12颗','图里每个点是一颗糖，外框圈住的12颗合起来看作1。',fdDots(12,0)),
  fdP('先把12颗平均分4组','每组3颗，这一组才是整盒的1/4。',vxBar('整盒12颗',4,1,'gold','3颗'),'12 ÷ 4 = 3（颗）'),
  fdP('取3组，得到整盒的3/4','3/4说取了几组；9颗说实际有多少。两种说法别混淆。',fdDots(12,9),'12 × 3/4 = 12 ÷ 4 × 3 = 9'),
  fdP('先估一估，再计算','只取整盒的3/4，取出的数量应当少于12颗。',vxPair(vxCard('一整个','12颗'),vxCard('其中3/4','9颗')))
 ],{type:'of',start:2,target:4,min:0,max:12,label:'从12颗糖中取几颗？',prompt:'取出整盒的1/3。先平均分3组，再取1组。'},(slot,seed)=>{const total=(seed%3+2)*4;return slot===0?fdQuestion(`${total}颗糖的3/4是几颗？`,total/4*3,'平均分4组，取3组','平均分3组，取4组','把3/4当成3颗',`每组${total/4}颗，3组共${total/4*3}颗。`,'分母决定分几组，分子决定取几组。','','几颗'):slot===1?fdQuestion(`${total}×1/4的结果和${total}相比怎样？`,null,'更小，因为只取其中一部分','更大，因为是乘法','相同，因为整体没有变','乘一个0到1之间的数，取到的是原量的一部分。','想想只拿整盒的四分之一。'):fdQuestion(`一根绳长${total}米，用去1/4，还剩几米？`,total*3/4,'问剩下，要取另外3/4','问剩下，直接填用去的1/4','把总长除以3',`剩下3/4，共${total*3/4}米。`,'先圈出题目问“用去”还是“剩下”。','','剩下几米');}),
 multiply:fdLesson('multiply',2,'一部分里，再取一部分','先种满菜地的2/3，再把已种部分的3/4种成萝卜。萝卜占整块菜地多少？','在一部分菜地里再选一部分，剩下多大？',['of','equal'],()=>[
  fdP('整块菜地只算一个整体','把整块平均分3行，再分4列，得到12个同样大的小格。',fdArea(3,4,0,0)),
  fdP('先取整块的2/3','先取2行，共8小格。这里的一整个仍然是整块菜地。',fdArea(3,4,2,0)),
  fdP('只在已取部分里，再取3/4','已取的2行按4列分，取其中3列。绿色6格是两次都取中的部分。',fdArea(3,4,2,3),'2/3 × 3/4 = 6/12 = 1/2'),
  fdP('乘法也可能让数量变小','取2/3的一部分，结果1/2比2/3小。分母相乘来自整块被分成几格。',fdStrip(12,8)+fdStrip(12,6,'再取其中3/4','green'),'分子数取到的格，分母数整个的格')
 ],{type:'multiply',start:1,target:3,min:0,max:4,label:'在4列中再取几列？',prompt:'先取2行，再取已选部分的3/4。绿色就是最后得到的部分。'},(slot,seed)=>{const p=seed%2+2,q=seed%3+3;return slot===0?fdQuestion(`1/${p}的1/${q}，占原来的整个多少？`,1/(p*q),'在已经取的部分里，再取一部分','把两个分数相加','只保留较大的分母',`整个分成${p*q}格，取1格，是1/${p*q}。`,'先分行，再分列，数交叠处。',fdArea(p,q,1,1),'占整个多少','fraction'):slot===1?fdQuestion(`2/3×3/4是多少？`,.5,'分母数整块格子，分子数交叠格子','乘法一定比两个数都大','分子分母分别相加','交叠6格，整块12格，所以1/2。','先算交叠处有几格，再与整个比。','','结果','fraction'):fdQuestion(`花圃的1/${p}种花，其中1/${q}种向日葵。向日葵占整个花圃多少？`,1/(p*q),'第二个分数的整体是已经种花的部分','第二个分数仍直接表示整个花圃','两个分数都指不同大小的花圃',`是整个花圃的1/${p*q}。`,'第二次只在第一次选中的范围里取。','','占整个花圃','fraction');}),
 share:fdLesson('share',2,'把一段分数，平均分给几人','只有3/4米彩带，平均分给3个人。先认清可分的彩带，不能把没拿来的部分也分掉。','只有3/4米彩带，3个人怎样平分？',['of','multiply'],()=>[
  fdP('实际拿来的是3/4米','整条参照线长1米；橙色才是手里的彩带。',fdStrip(4,3,'1米参照，手里有3/4米')),
  fdP('把3份平均给3人','手里刚好3个1/4米，每人拿1个。',vxBar('实际的3/4米',3,3,'gold','1/4米'),'3/4 ÷ 3 = 1/4'),
  fdP('不是每个人都拿原来的3/4','每人只拿到现有量的1/3。加回3个人的量，要等于原来的量。',fdStrip(4,1,'每人所得'),'3 × 1/4 = 3/4'),
  fdP('换成2个人，也按现有量平均分','把3/4换成6/8，再分给2人，每人3/8米。',fdStrip(8,3,'每人所得'),'3/4 ÷ 2 = 3/8')
 ],{type:'share',start:2,target:3,min:2,max:4,label:'把3/4米平均分给几人？',prompt:'给3个人平均分，观察每人拿到的长度。'},(slot,seed)=>{const d=seed%3+4;return slot===0?fdQuestion(`2/${d}米平均分给2人，每人几米？`,1/d,'把现有的2个小份平均分成2组','把完整1米平均分给2人','分母除以2就行',`2个1/${d}米平均分，每人1/${d}米。`,'只分题目实际拿来的部分。',fdStrip(d,2),'每人几米','fraction'):slot===1?fdQuestion(`1/${d}÷2是多少？`,1/(d*2),'把原来的一小份再平均分成2份','除法一定得到整数','把分子减2',`每份是1/${d*2}。`,'把原来的小份再切半。','','结果','fraction'):fdQuestion(`3/${d}升果汁平均倒入3杯，每杯几升？`,1/d,'三杯合起来应还原原来的果汁量','每杯都是3升','把杯数当成新的分子',`每杯1/${d}升，3杯合起来3/${d}升。`,'可以用每杯量乘3来检查。','','每杯几升','fraction');}),
 divide:fdLesson('divide',2,'里面装得下几个小段','手里有2米绳子，每2/3米剪成一段。除法在问：这些绳子里有几个这么长的小段？','2米绳子，每段2/3米，能剪几段？',['equal','share','over'],()=>[
  fdP('被除数是总量，除数是每段多长','总量2米，每段2/3米；问能剪出几段。先分清三个量。',fdStrip(3,6,'总量2米')+fdStrip(3,2,'每段2/3米')),
  fdP('都换成三分之一米来数','2米是6个1/3米。每段占2个这样的小份。',fdMeasure(6,3,2),'2 ÷ 2/3 = 6份 ÷ 2份'),
  fdP('每2份圈成一组，共3组','一组就是题目中的一段，不是三分之一米的小份。',fdMeasure(6,3,2),'6 ÷ 2 = 3（段）'),
  fdP('为什么可以乘倒数？','先乘3，把米换成三分之一米；再除以2，把每2小份组成一段。',fdMeasure(6,3,2),'2 × 3 ÷ 2 = 2 × 3/2 = 3'),
  fdP('最后半组，也可以表示','3/4米按每1/2米来量，能装1整组，再装半组，共1又1/2组。',fdMeasure(3,4,2),'3/4 ÷ 1/2 = 3/2')
 ],{type:'divide',start:1,target:2,min:1,max:6,label:'每段含几个1/3米？',prompt:'总量2米，每段2/3米。把每2个小份圈成一组。'},(slot,seed)=>{const d=seed%3+3;return slot===0?fdQuestion(`2米绳子，每1/${d}米剪一段，能剪几段？`,2*d,'总量里包含几个指定长度的小段','把总长平均分给分母个人','除法结果一定更小',`2米有${2*d}个1/${d}米。`,'先把2米换成指定的小单位。','','几段'):slot===1?fdQuestion('3/4÷1/2是多少？',1.5,'用1/2作一组，能装1整组和半组','结果只能是整数','只把两个分母相除','3/4是3个1/4，一组2个1/4，所以3÷2=3/2。','把两种长度都改用四分之一量。','','结果','fraction'):fdQuestion(`有${d-1}/${d}升饮料，每杯1/${d}升，能装几杯？`,d-1,'看总量能装几个同样大的杯量','把每杯量乘总量','除以分数就是分子分母一起相加',`有${d-1}个1/${d}升，能装${d-1}杯。`,'这次问杯数，不是每杯多少。','','杯数');}),
 percent:fdLesson('percent',3,'一个量，三种名字','一张百格纸代表整个。分数、小数和百分数，可以说同一个涂色范围。','1/4、0.25和25%，为什么说的是一样多？',['equal','of'],()=>[
  fdP('一整张是1，也就是100%','百格纸有100个同样大的小格。每格是整个的1/100。',fdHundred(100)),
  fdP('涂25格，是四分之一张','把100格分成4组，每组25格。',fdHundred(25),'25/100 = 1/4'),
  fdP('也可以写成0.25或25%','0.25表示25个百分之一；25%读作百分之二十五。它们不是25个整体。',fdHundred(25),'1/4 = 0.25 = 25%'),
  fdP('写法变了，数量仍然相同','同样的1/2，可以改写为50/100、0.5和50%。',fdHundred(50),'1/2 = 0.5 = 50%')
 ],{type:'percent',start:50,target:25,min:0,max:100,step:5,label:'百格纸涂多少格？',prompt:'涂出整张的1/4，同时看看它的小数和百分数写法。'},(slot,seed)=>{const a=[25,50,75][seed%3];return slot===0?fdQuestion(`${a}%写成最简分数是多少？`,a/100,'百分数表示以100等份来计数','百分数表示几个整体','去掉百分号数值不变',`${a}%=${a}/100=${fdF(a,100)}。`,'分母先写100，再约分。',fdHundred(a),'最简分数','fraction'):slot===1?fdQuestion(`${a/100}写成百分数，百分号前应填几？`,a,'一个整体对应100%','小数点后有几位就写几','小数变百分数要除以100',`${a/100}=${a}%。`,'先看相当于几个百分之一。','','百分号前的数'):fdQuestion(`一盒有20块积木，其中${a}%是蓝色，有几块蓝色积木？`,20*a/100,'先把百分数看成整个的几分之几','百分数就是积木块数','20块表示20个百分之一',`20×${a}/100=${20*a/100}块。`,'百分数描述占比，还要结合整盒有多少。','','蓝色几块');}),
 back:fdLesson('back',3,'知道几份，找回整个','小狐狸准备了3袋同样多的橘子，一共6个。全部要准备8袋，怎样从已知部分找到全部？','只知道一部分有多少，能找到全部吗？',['of','divide'],()=>[
  fdP('已知6个，只对应3袋','每袋同样多，一袋作一份。不是每一袋都有6个。',vxBags(3,2),'已知的3份合起来6个'),
  fdP('先求一份','把6个平均分成3份，得到每份2个。',vxBags(1,2),'6 ÷ 3 = 2（个/份）'),
  fdP('再补齐完整8份','整个共有8份，每份仍是2个，所以共16个。',vxBags(8,2),'6 ÷ 3 × 8 = 16'),
  fdP('为什么这次用除法？','6是整个的3/8。用部分除以对应的分数，倒着找整个。',fdStrip(8,3),'6 ÷ 3/8 = 16')
 ],{type:'back',start:1,target:2,min:1,max:6,label:'每袋放几个？',prompt:'调到前3袋合起来6个，再看完整8袋的总数。'},(slot,seed)=>{const one=seed%4+3;return slot===0?fdQuestion(`一盒糖的2/5是${one*2}颗，整盒几颗？`,one*5,`已知${one*2}颗对应2份`,'已知数对应5份','直接把已知量再乘2/5',`先${one*2}÷2=${one}，再乘5。`,'先给已知数量贴上“对应几份”的标签。','','整盒几颗'):slot===1?fdQuestion(`一盒原有${one*5}颗，拿走2/5，拿走几颗？`,one*2,'这次已知的是完整5份','和上一问一样要倒推整个','分母表示拿走的颗数',`${one*5}÷5×2=${one*2}颗。`,'先判断已知量是全部还是部分。','','拿走几颗'):fdQuestion(`${one*3}页占全书3/4。全书还剩几页没读？`,one,'先求全书一份，再取剩下的一份','把总页数直接填到还剩','已读页数就是一份',`每份${one}页，还剩1/4，所以还剩${one}页。`,'求出一份后，检查最后问的是全部还是剩下。','','还剩几页');}),
 base:fdLesson('base',3,'这一次，跟谁比较','熊熊4块饼干，兔兔6块。兔兔比熊熊多一半，反过来却不是少一半。我们来找原因。','多一半，反过来就少一半吗？',['whole','of','back'],()=>[
  fdP('先摆清谁有多少','两个盘子中的饼干同样大。差始终是2块。',vxPair(vxCard('熊熊4块',vxCount(4,'cookie')),vxCard('兔兔6块',vxCount(6,'cookie')))),
  fdP('兔兔比熊熊多，按熊熊算','多出的2块，占熊熊4块的1/2。',fdStrip(4,2,'以熊熊4块为整个'),'多2 ÷ 4 = 1/2'),
  fdP('熊熊比兔兔少，按兔兔算','少掉的2块，占兔兔6块的1/3。差没变，比较的整个变了。',fdStrip(6,2,'以兔兔6块为整个'),'少2 ÷ 6 = 1/3'),
  fdP('比与占比，也要先排名字','熊∶兔＝4∶6＝2∶3；熊占两人合计的4/10＝2/5。整体不同，答案不同。',fdDots(10,4,'块饼干','两人的全部饼干'),'每次先写：跟谁比？')
 ],{type:'base',start:2,target:1,min:1,max:2,label:'选择比较对象',prompt:'问“兔兔比熊熊多几分之几”，应拿谁作整个？',options:['熊熊4块','兔兔6块']},(slot,seed)=>{const k=seed%3+2,a=k*2,b=k*3;return slot===0?fdQuestion(`甲${a}张，乙${b}张。乙比甲多几分之几？`,.5,'多出的量要除以甲','多出的量要除以乙','直接用乙减甲作分数',`差${k}张，按甲${a}张算，得1/2。`,'“比甲多”，就跟甲比。','','多几分之几','fraction'):slot===1?fdQuestion(`甲${a}张，乙${b}张。甲比乙少几分之几？`,1/3,'少掉的量要除以乙','和上一题一样还是1/2','用两人总和作整体',`差${k}张，按乙${b}张算，得1/3。`,'这次跟谁比，名字换了吗？','','少几分之几','fraction'):fdQuestion(`甲${a}张，乙${b}张。甲占两人总数的多少？`,.4,'这次整个是甲乙合计','整个仍然只有乙','整个只有甲',`甲占${a}/${a+b}=2/5。`,'先把这次的完整整体圈出来。','','占总数多少','fraction');}),

function fdMeasure(n,d,group){return `<div class="fd-measure" style="--parts:${n}" role="img" aria-label="总量${fdF(n,d)}，每组${fdF(group,d)}">${Array.from({length:n},(_,i)=>`<span class="${Math.floor(i/group)%2?'blue':'gold'} ${(i+1)%group===0?'group-end':''}">1/${d}</span>`).join('')}</div><p class="vx-legend">每格1/${d}米；每${group}格圈成一组。分组边界用粗线标出。</p>`;}
function fdHundred(n){return `<div class="fd-hundred" role="img" aria-label="整张100格，涂色${n}格">${Array.from({length:100},(_,i)=>`<i class="${i<n?'lit':''}"></i>`).join('')}</div><p class="vx-legend">每格都是1/100；${n}格是${n}%。</p>`;}

function fdState(){
 const f=s.foundation||(s.foundation={version:1,id:'fair',phase:0,labs:{},reasons:{},sessions:{},records:{}});
 if(!FD[f.id])f.id='fair';if(!Number.isInteger(f.phase)||f.phase<0||f.phase>4)f.phase=0;
 for(const k of ['labs','reasons','sessions','records'])if(!f[k]||typeof f[k]!=='object')f[k]={};
 return f;
}
function fdLessonNow(){return FD[fdState().id];}
function fdRecord(id=fdState().id){return fdState().records[id]||(fdState().records[id]={history:[],lastError:null});}
function fdSession(phase=fdState().phase){const f=fdState(),key=f.id+':'+phase;return f.sessions[key]||(f.sessions[key]={round:0,index:0,items:[{},{},{}]});}
function fdQuestionNow(){const f=fdState(),t=fdSession();return FD[f.id].questions(t.index,t.round*5+(f.phase===4?11:0)+t.index);}
function fdAnswerState(){const t=fdSession(),i=t.index;return t.items[i]||(t.items[i]={});}
function fdNextDay(day,offset){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10);}
function fdDue(id){const r=fdRecord(id);if(!r.establishedDay)return null;const intervals=[1,3,7,14],base=r.lastReview?.independent?r.lastReview.day:r.establishedDay;return fdNextDay(base,intervals[Math.min(r.reviewLevel||0,3)]);}
function fdStatus(id){const r=fdRecord(id);if(r.lastError)return '有一处需要再看看';if(r.lastReview?.independent)return '已通过隔天检验';if(r.establishedDay)return '已独立完成 · 过一天再试';if(r.practice)return '练过了 · 再独立试试';return r.history.length?'正在练习':'还没开始';}
function fdRecommend(){
 const f=fdState(),ids=Object.keys(FD),due=ids.find(id=>{const d=fdDue(id);return d&&d<=today();});
 if(due)return {id:due,phase:4,reason:'之前已经独立做对，今天换题看看还记不记得。'};
 const repair=ids.find(id=>fdRecord(id).lastError);
 if(repair){const suggested=fdRecord(repair).repairLesson||FD_REPAIR[repair];const target=suggested&&!fdRecord(suggested).establishedDay?suggested:repair;return {id:target,phase:target===repair?1:0,reason:`上次在“${FD[repair].title}”遇到一点困难，先把相关的图看清楚。`};}
 const next=ids.find(id=>!fdRecord(id).establishedDay)||ids[ids.length-1];
 return {id:next,phase:0,reason:next==='fair'?'不需要先认识分数。我们从分一块巧克力开始。':'前面练过的会保留，接着建立下一步理解。'};
}
function fdHome(){const rec=fdRecommend(),independent=Object.keys(FD).filter(id=>fdRecord(id).establishedDay&&!fdRecord(id).lastError).length,reviewed=Object.keys(FD).filter(id=>fdRecord(id).lastReview?.independent&&!fdRecord(id).lastError).length;return `<main class="ma-main fd-home"><h1>分数，从分一块巧克力开始</h1><p class="fd-intro">先看见，再动手；能说清楚，再换一道自己做。</p><section class="fd-next"><div><p>接下来可以试试</p><h2>${FD[rec.id].title}</h2><p>${rec.reason}</p></div><button type="button" class="ma-primary" data-fd-start="${rec.id}" data-fd-phase="${rec.phase}">从这里开始 →</button></section><p class="fd-progress-line">18课中，${independent}课已完成独立练习，${reviewed}课已通过隔天检验。看过、跳过都不算通过。</p><p class="ma-caption">所有课程与步骤都可以自由选择。第一次建议从第1课开始，一次慢慢学一课。</p>${FD_GROUPS.map((g,gi)=>`<details class="fd-course-group" ${gi===FD[rec.id].group?'open':''}><summary><b>${gi+1}</b>${g}</summary><div>${Object.values(FD).filter(l=>l.group===gi).map(l=>`<button type="button" class="fd-course-row" data-fd-start="${l.id}" data-fd-phase="0"><span class="fd-course-number">${Object.keys(FD).indexOf(l.id)+1}</span><span><strong>${l.title}</strong><small>${l.focus}</small></span><em>${fdStatus(l.id)}</em></button>`).join('')}</div></details>`).join('')}<section class="fd-next fd-transfer"><div><h2>把理解带回原来的错题</h2><p>基础稳了，再挑战分橘子、盐水、折纸、赛车等九个故事。原有记录都保留。</p></div><button class="ma-secondary" data-nav="map" type="button">去错题探险地图 →</button></section><button class="ma-link" data-fd="records" type="button">查看我的分数足迹</button></main>`;}
function fdRail(){const f=fdState();return `<nav class="ma-route fd-route" aria-label="基础课五个环节，可自由选择">${FD_PHASES.map((t,i)=>`<button type="button" data-fd-go="${i}" ${f.phase===i?'aria-current="step"':''}><b>${i+1}</b><span>${t}</span></button>`).join('')}</nav><p class="ma-route-tip">点数字可以任选、跳过和回来看看；不会清掉你填过的内容。</p>`;}
function fdLabState(){const f=fdState(),l=FD[f.id];return f.labs[f.id]||(f.labs[f.id]={value:l.lab.start,feedback:'',passed:false});}
function fdLabModel(){const l=fdLessonNow(),v=fdLabState().value;switch(l.lab.type){
 case 'cut':return fdCut(v);
 case 'unit':return fdStrip(v,1,'同一根面包')+`<p class="fd-live-result">取的一份写作 1/${v}</p>`;
 case 'build':return fdStrip(5,v)+`<p class="fd-live-result">${v}个1/5，是${v}/5${v===5?'，也就是1':v===0?'，也就是0':''}。</p>`;
 case 'whole':return fdDots(v,1,'块饼干')+`<p class="fd-live-result">同一块饼干占这个整体的1/${v}。</p>`;
 case 'line':return fdLine(4,v,1,true)+`<p class="fd-live-result">现在到 ${fdF(v,4)}</p>`;
 case 'over':return fdLine(4,v,2,true)+fdStrip(4,v)+`<p class="fd-live-result">${v}/4 = ${Math.floor(v/4)}个完整的1，再加${v%4}/4。</p>`;
 case 'equal':return fdStrip(2,1)+fdStrip(v*2,v,'同样长，换一种切法','blue')+`<p class="fd-live-result">1/2 = ${v}/${v*2}，涂色总长度没变。</p>`;
 case 'compare':return fdStrip(8,5,'橙条')+fdStrip(8,v,'同样大小的蓝条','blue')+`<p class="fd-live-result">蓝条${v}/8 ${v===5?'等于':v<5?'小于':'大于'} 橙条5/8。</p>`;
 case 'add':return fdSum(5,2,v)+`<p class="fd-live-result">2/5 + ${v}/5 = ${fdF(v+2,5)}。</p>`;
 case 'common':return v%2===0&&v%3===0?fdStrip(v,v/2)+fdStrip(v,v/3,'同样大小的另一条','blue')+`<p class="fd-live-result">1/2 = ${v/2}/${v}；1/3 = ${v/3}/${v}。${v===6?'这是最少的共同等份。':'也能对齐，还能用更少的小格吗？'}</p>`:fdStrip(2,1)+fdStrip(3,1)+`<p class="fd-live-result">分成${v}份，不能同时整齐对齐二分之一和三分之一。</p>`;
 case 'of':return fdDots(12,v)+`<p class="fd-live-result">取了${v}颗，占整盒的${v}/12。</p>`;
 case 'multiply':return fdArea(3,4,2,v)+`<p class="fd-live-result">绿色${2*v}格，占整个${fdF(2*v,12)}。</p>`;
 case 'share':return fdStrip(4,3,'实际拿来的3/4米')+fdStrip(4*v,3,'每个人分到的长度','blue')+`<p class="fd-live-result">3/4 ÷ ${v} = ${fdF(3,4*v)}（米/人）</p>`;
 case 'divide':return fdMeasure(6,3,v)+`<p class="fd-live-result">总量2米，每段${v}/3米，可以量出${fdF(6,v)}段。</p>`;
 case 'percent':return fdHundred(v)+`<p class="fd-live-result">${fdF(v,100)} = ${v/100} = ${v}%</p>`;
 case 'back':return vxBar('已经准备的3袋',3,3,'gold',`${v}个`,`合起来${v*3}个，题目需要合起来6个`)+vxBar('完整8袋',8,8,'green',`${v}个`,`全部${v*8}个`);
 case 'base':return vxPair(vxCard('熊熊',vxCount(4,'cookie'),'4块'),vxCard('兔兔',vxCount(6,'cookie'),'6块'))+`<p class="fd-live-result">差2块。按${v===1?'熊熊4':'兔兔6'}块算，差占${v===1?'1/2':'1/3'}。</p>`;

 default:return '';
}}
function fdLabView(){const l=fdLessonNow(),v=fdLabState();return `<p class="fd-intro">${l.lab.prompt}</p><section class="fd-workbench"><div id="fd-lab-picture">${fdLabModel()}</div><label class="fd-control"><strong>${l.lab.label}</strong>${l.lab.options?`<div class="fd-pick-options">${l.lab.options.map((x,i)=>`<button class="ma-secondary" type="button" data-fd-lab-value="${i+1}" aria-pressed="${v.value===i+1}">${x}</button>`).join('')}</div>`:`<div class="fd-range-row"><button type="button" data-fd-adjust="-1" aria-label="减少" ${v.value<=l.lab.min?'disabled':''}>−</button><input id="fd-lab-range" type="range" min="${l.lab.min}" max="${l.lab.max}" step="${l.lab.step||1}" value="${v.value}" aria-label="${l.lab.label}"><button type="button" data-fd-adjust="1" aria-label="增加" ${v.value>=l.lab.max?'disabled':''}>＋</button><output id="fd-lab-value">${v.value}</output></div>`}</label><button type="button" class="ma-primary" data-fd="lab-check">检查我的操作</button><div id="fd-lab-feedback" aria-live="polite">${v.feedback?`<p class="ma-feedback ${v.passed?'success':''}">${v.feedback}</p>`:''}</div></section><p class="ma-caption">这里可以反复试。看懂以后，再到第4步独立做一道新题。</p>`;}
function fdReasonView(){const f=fdState(),q=FD_REASONS[f.id],r=f.reasons[f.id]||(f.reasons[f.id]={choice:'',note:''});return `<p class="ma-question">${q[0]}</p><div class="ma-choices">${[2,1,3].map(i=>`<button class="ma-choice ${Number(r.choice)===i?(i===1?'right':'try'):''}" type="button" data-fd-reason="${i}">${q[i]}</button>`).join('')}</div>${r.choice!==''?`<p class="ma-feedback ${r.choice===1?'success':''}">${r.choice===1?'你找到了关键关系。现在用自己的话说一遍，再去独立试。':'回到图里找一找：'+q[1]+'。'}</p>`:''}<label class="ma-field"><span>我可以这样解释……（也可以说给大人听）</span><textarea id="fd-reason-note" rows="2" maxlength="240">${escape(r.note)}</textarea></label><p class="ma-caption">自己的解释留给孩子和大人讨论，程序不自动判断表达是否真正理解。</p>`;}
function fdAssessmentView(){const f=fdState(),session=fdSession(),e=fdAnswerState(),q=fdQuestionNow(),r=fdRecord(),review=f.phase===4,delayed=review&&r.establishedDay&&today()>r.establishedDay;const shift=(Object.keys(FD).indexOf(f.id)+session.index+session.round)%3,options=q.relation.options.map((text,i)=>({text,i})),ordered=options.slice(shift).concat(options.slice(0,shift));return `<p class="fd-intro">${review?(delayed?'今天换一组题，看看前面的理解是否还在。':'可以先换题练。第一次独立完成会建立记录；隔一天再完成，才算隔天检验。'):'先自己想一想。每组3题，会换图、换数字或换问法。'}</p><nav class="fd-quiz-tabs" aria-label="自由选择练习题">${['先试一题','换个角度','换个情境'].map((t,i)=>`<button type="button" class="ma-secondary" data-fd-item="${i}" ${i===session.index?'aria-current="page"':''}>${i+1} ${t}${session.items[i]?.passed?' ✓':''}</button>`).join('')}</nav><section class="ma-paper"><p>${q.body}</p>${q.figure}</section><form id="fd-quiz-form"><label class="ma-field"><span>${q.relation.prompt}</span><select id="fd-quiz-reason" ${e.passed?'disabled':''}><option value="">请选择</option>${ordered.map(x=>`<option value="${x.i}" ${String(e.reason)===String(x.i)?'selected':''}>${x.text}</option>`).join('')}</select></label>${q.fields.map((x,i)=>`<label class="ma-field"><span>${x.label}</span><input data-fd-answer="${i}" type="text" inputmode="${x.type==='number'?'decimal':'text'}" maxlength="40" value="${escape(e.answers?.[i]||'')}" placeholder="${x.type==='fraction'?'例如 2/5':'填数字'}" ${e.passed?'disabled':''}></label>`).join('')}${!e.passed?'<button class="ma-primary" type="submit">检查关系和答案</button>':''}</form><div aria-live="polite">${e.feedback?`<p class="ma-feedback ${e.passed?'success':''}">${escape(e.feedback)}</p>`:''}</div>${e.help?`<aside class="ma-repair"><strong>只补这一点</strong><p>${q.hint}</p>${e.help>=2?`<p>${q.explain}</p>`:''}${r.repairLesson&&r.repairLesson!==f.id?`<p>这次可以补看：<button class="ma-link" type="button" data-fd-start="${r.repairLesson}" data-fd-phase="0">${FD[r.repairLesson].title}</button></p>`:''}<button class="ma-link" type="button" data-fd-go="1">回到这课的动手图</button></aside>`:''}<div class="ma-footer">${e.passed?`<details><summary>看看完整想法</summary><p>${q.explain}</p></details>`:`<button class="ma-secondary" type="button" data-fd="help" ${e.help>=2?'disabled':''}>${e.help?'再看解题思路':'给我一点提示'}</button>`}<button class="ma-secondary" type="button" data-fd="quiz-next">${session.index<2?'下一题 →':'看看本组记录 →'}</button></div>${session.items.every(x=>x.passed)?`<section class="fd-result"><h2>这组题，做到了哪一步？</h2><p>${session.items.every(x=>x.independent)?(delayed?'三种问法都独立做对，完成一次隔天检验。':'三种问法都独立做对了。隔一天再换题验证。'):'已经订正完成。看过帮助或重试的题，与独立做对分别记录。'}</p><button type="button" class="ma-primary" data-fd="new-round">换一组新题再试</button></section>`:''}<p class="ma-caption">打开提示或提交后订正，会记为“帮助后完成”。跳过不记完成；点到最后不等于掌握。</p>`;}
function fdRecordsView(){return `<main class="ma-main"><h1>我的分数足迹</h1><p>这里会留下你独立做对的题，以及隔几天再做的结果。遇到难处也没关系，回到图里试一试。</p>${Object.values(FD).map(l=>{const r=fdRecord(l.id),due=fdDue(l.id);return `<div class="fd-record-row"><div><strong>${l.title}</strong><p>${fdStatus(l.id)}</p>${r.lastError?`<small>上次需要再看：${escape(r.lastError)}</small>`:due?`<small>下次换题复习：${due}</small>`:''}</div><button class="ma-secondary" type="button" data-fd-start="${l.id}" data-fd-phase="${due&&due<=today()?4:3}">去试试</button></div>`;}).join('')}<button type="button" class="ma-primary" data-fd="home">回到课程路线</button></main>`;}
function fdView(){if(s.mode==='journey')return fdHome();if(s.mode==='fraction-records')return fdRecordsView();const f=fdState(),l=FD[f.id];return `<main class="ma-main fd-main">${fdRail()}<div class="fd-lesson-line"><button type="button" class="ma-link" data-fd="home">← 分数学习路线</button><span>第${Object.keys(FD).indexOf(f.id)+1}课 / 18课</span></div><h1>${l.title}</h1>${f.phase===0?`<div class="picnic-story"><span aria-hidden="true">🦊</span><p>${l.story}</p></div><div class="fd-visual-anchor"></div>`:f.phase===1?fdLabView():f.phase===2?fdReasonView():fdAssessmentView()}<div class="ma-free-footer"><span>想从哪一步开始都可以；跳过不会记作完成。</span><button class="ma-secondary" type="button" ${f.phase<4?`data-fd-go="${f.phase+1}"`:'data-fd="home"'}>${f.phase<4?'去下一步 →':'回到学习路线 →'}</button></div></main>`;}
function fdNavigate(id,phase=0){rememberView();stopSpeech();const f=fdState();if(FD[id])f.id=id;f.phase=Math.min(4,Math.max(0,phase));if(f.phase===4){const t=fdSession(4),due=fdDue(f.id);if(due&&due<=today()&&t.completedDay&&t.completedDay<today()&&t.items.every(x=>x.passed)){t.round++;t.index=0;t.items=[{},{},{}];}}s.mode='foundation';render();save();topOfTask();}
function fdSetLab(value,redraw=true){const l=fdLessonNow(),v=fdLabState();v.value=Math.max(l.lab.min,Math.min(l.lab.max,Number(value)));v.feedback='';v.passed=false;if(redraw){render();save();}else{root.querySelector('#fd-lab-picture').innerHTML=fdLabModel();root.querySelector('#fd-lab-value').textContent=v.value;root.querySelector('#fd-lab-feedback').innerHTML='';root.querySelector('[data-fd-adjust="-1"]').disabled=v.value<=l.lab.min;root.querySelector('[data-fd-adjust="1"]').disabled=v.value>=l.lab.max;}}
function fdCheckLab(){const l=fdLessonNow(),v=fdLabState();v.passed=v.value===l.lab.target;v.feedback=v.passed?'你把图里的关系做出来了。可以再改一改，观察变化；然后到第4步独立试。':l.lab.type==='cut'?`左边${v.value}小格，右边${8-v.value}小格，还没有一样多。`:'再对照任务看一看：'+l.lab.prompt;render();save();}
function fdSimplest(text){const value=String(text).trim().replace(/／/g,'/').replace(/\s/g,'');const m=value.match(/^([0-9]+)\/([0-9]+)$/);return !!m&&Number(m[2])>0&&fdG(Number(m[1]),Number(m[2]))===1;}
function fdSubmit(){const f=fdState(),e=fdAnswerState(),q=fdQuestionNow(),r=fdRecord(),session=fdSession();if(e.passed)return;e.answers=e.answers||[];if(e.reason===undefined||e.reason===''||q.fields.some((_,i)=>!String(e.answers[i]||'').trim())){e.feedback='先选好关系，再把需要的数字填上。没填完不算答错。';render();return;}e.attempts=(e.attempts||0)+1;const relation=Number(e.reason)===q.relation.correct,numbers=q.fields.every((field,i)=>fieldOK(e.answers[i],field));if(!relation||!numbers){e.assisted=true;e.feedback=relation?'你找对了关系，再核对一份多大、取了几份，以及题目最后问什么。':'先把关系看清楚：'+q.hint;r.lastError=relation?'数量计算或最后问法':FD[f.id].focus;r.repairLesson=relation?f.id:FD_REPAIR[f.id];render();save();return;}if(q.fields.some((field,i)=>field.label==='最简分数'&&!fdSimplest(e.answers[i]))){e.assisted=true;e.feedback='数的大小对了。题目还要求“最简分数”：把分子和分母同时除以相同的数，直到不能再约分，然后写成几分之几。';r.lastError='最简分数还需要约分';r.repairLesson='equal';render();save();return;}e.passed=true;e.independent=e.attempts===1&&!e.assisted&&!e.help;e.feedback=e.independent?'这道题的关系和答案都独立做对了。':'这道题已经订正正确，记作“帮助后完成”。';r.history.push({phase:f.phase,round:session.round,item:session.index,day:today(),independent:e.independent,attempts:e.attempts,help:e.help||0});r.history=r.history.slice(-60);if(session.items.every(x=>x.passed)){session.completedDay=today();const evidence={day:today(),independent:session.items.every(x=>x.independent),round:session.round};if(f.phase===3)r.practice=evidence;else if(r.establishedDay&&today()>r.establishedDay){r.lastReview=evidence;if(evidence.independent)r.reviewLevel=(r.reviewLevel||0)+1;}else r.sameDay=evidence;if(evidence.independent){r.establishedDay=r.establishedDay||today();r.lastError=null;}else{r.lastError='这组使用了帮助，待独立再试';}}render();save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.fdStart){fdNavigate(b.dataset.fdStart,Number(b.dataset.fdPhase)||0);return;}
 if(b.dataset.fdGo!==undefined){fdNavigate(fdState().id,Number(b.dataset.fdGo));return;}
 if(b.dataset.fdItem!==undefined){fdSession().index=Number(b.dataset.fdItem);render();save();return;}
 if(b.dataset.fdMark!==undefined){fdSetLab(Number(b.dataset.fdMark));return;}
 if(b.dataset.fdLabValue!==undefined){fdSetLab(Number(b.dataset.fdLabValue));return;}
 if(b.dataset.fdAdjust!==undefined){fdSetLab(fdLabState().value+Number(b.dataset.fdAdjust)*(fdLessonNow().lab.step||1));return;}
 if(b.dataset.fdReason!==undefined){const f=fdState(),r=f.reasons[f.id]||(f.reasons[f.id]={note:''});r.choice=Number(b.dataset.fdReason);render();save();return;}
 const key=b.dataset.fd;if(!key)return;
 if(key==='home'||key==='records'){rememberView();stopSpeech();s.mode=key==='home'?'journey':'fraction-records';render();save();topOfTask();}
 else if(key==='lab-check')fdCheckLab();
 else if(key==='help'){const e=fdAnswerState();if(!e.passed){e.help=Math.min(2,(e.help||0)+1);e.assisted=true;render();save();}}
 else if(key==='quiz-next'){const t=fdSession();if(t.index<2)t.index++;else{s.mode='fraction-records';}render();save();topOfTask();}
 else if(key==='new-round'){const t=fdSession();t.round++;t.index=0;t.items=[{},{},{}];render();save();topOfTask();}
});
root.addEventListener('input',e=>{if(e.target.id==='fd-lab-range')fdSetLab(e.target.value,false);if(e.target.dataset.fdAnswer!==undefined){const t=fdAnswerState();if(!t.answers)t.answers=[];t.answers[Number(e.target.dataset.fdAnswer)]=e.target.value;save();}if(e.target.id==='fd-reason-note'){const f=fdState();f.reasons[f.id].note=e.target.value;save();}});
root.addEventListener('change',e=>{if(e.target.id==='fd-lab-range')save();if(e.target.id==='fd-quiz-reason'){fdAnswerState().reason=e.target.value;save();}});
root.addEventListener('submit',e=>{if(e.target.id==='fd-quiz-form'){e.preventDefault();fdSubmit();}});

function config(){const all=pages()[s.lesson];if(s.step>=all.length)s.step=all.length-1;return all[s.step]}
const act=(label,key,primary=false,disabled=false)=>`<button type="button" class="${primary?'ma-primary':'ma-secondary'}" data-act="${key}" ${disabled?'disabled':''}>${label}</button>`;
const tokens=(n,icon,cls='')=>Array.from({length:n},()=>`<span class="ma-token ${cls}" aria-hidden="true">${icon}</span>`).join('');
const svg=(w,h,label,body)=>`<svg class="ma-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}"><title>${label}</title>${body}</svg>`;
const txt=(x,y,t,anchor='middle',cls='')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" class="${cls}">${t}</text>`;

if(id==='factory'){
 if(k===3)return `<div class="ma-recipe"><span>🧱 水泥2份</span><span>🏖️ 黄沙3份</span><span>🪨 石子5份</span></div><div class="ma-statement">每种原来都有600吨</div><div class="ma-row"><span class="ma-row-name">黄沙</span>${tokens(3,'🟨')}<span class="ma-counter">合起来600吨</span></div><div class="ma-caption">一份是多少？水泥用2份，石子用5份。</div>`;
 const b=v.batches,extra=v.supplement;

 b+=`<line x1="0" y1="10" x2="${px}" y2="${h+10}" stroke="#5c5141" stroke-width="3"/><circle cx="${px}" cy="${h+10}" r="9" fill="#207665"/>`;

 if(k===0)return `<div class="ma-statement">🧂 新加：15克盐 ↓</div>${svg(320,200,'向盐水瓶里加盐，水保持不变',`<path d="M90 20 V175 Q90 185 100 185 H220 Q230 185 230 175 V20" fill="#cbe6ef" stroke="#789990" stroke-width="3"/><path d="M90 75 Q125 65 160 75 T230 75 V175 Q230 185 220 185 H100 Q90 185 90 175Z" fill="#83c3dc"/>${txt(160,127,'原来的盐 ＋ 水')}`)}<div class="ma-caption">瓶中的盐已经溶在水里。</div>`;
