<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语节奏大师 · WORD BEAT</title>
<meta name="description" content="七键古典旋律音游：C 到 B 固定音阶、经典主题编曲与英语拼词。">
<link rel="stylesheet" href="style.css?v=20260825d">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="560" height="640" tabindex="0" aria-label="英语节奏大师七键轨道"></canvas>

  <div id="hud">
    <div class="top">
      <div class="chips">
        <span class="chip">⭐ <b id="score">0</b></span>
        <span class="chip">🏁 谱面 <b id="level">1</b></span>
        <span class="chip" id="capsules">💊 0/5</span>
        <span class="chip">🎼 <b id="bpm">118</b> BPM</span>
      </div>
      <div class="life-wrap"><div id="life-bar"></div></div>
      <div class="chips">
        <button id="mute-btn">声音</button>
        <button id="pause-btn">暂停</button>
      </div>
    </div>
    <div id="word-bar" class="hidden">
      <span id="wb-kind">节奏拼词</span><span id="wb-word"></span>
      <div id="wb-zh"></div>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="overlay" id="menu">
    <div class="panel">
      <img class="menu-cover" src="assets/cover.png" alt="七轨霓虹音乐舞台">

      <h1>英语节奏大师<small>WORD BEAT</small></h1>
      <p class="sub">七轨就是 C—D—E—F—G—A—B。D/K 固定蓝键，S/F/J/L 固定白键；字母附着在真实旋律音符上。</p>
      <div class="scale-map" aria-label="七键音阶映射">
        <span class="white"><b>S</b><small>C</small></span><span class="blue"><b>D</b><small>D</small></span>
        <span class="white"><b>F</b><small>E</small></span><span class="gold"><b>空格</b><small>F</small></span>
        <span class="white"><b>J</b><small>G</small></span><span class="blue"><b>K</b><small>A</small></span>
        <span class="white"><b>L</b><small>B</small></span>
      </div>
      <div class="keys">
        <span>键盘 / 多点触控</span><span>15 连击 +1 💊（上限 5）</span><span>P 暂停</span><span>M 静音</span>
      </div>
      <div class="judge-guide">
        <span class="j p">PERFECT ±45ms</span>
        <span class="j g">GREAT ±90ms</span>
        <span class="j o">GOOD ±140ms</span>
      </div>
      <div class="opt-row song-row">
        <label class="opt-label" for="song-select">曲目</label>
        <select id="song-select">
          <option value="joy">欢乐颂</option>
          <option value="canon">卡农进行曲</option>
          <option value="twinkle">小星星变奏</option>
          <option value="mary">玛丽有只小羊羔</option>
          <option value="frere">两只老虎</option>
          <option value="jingle">铃儿响叮当</option>
          <option value="london">伦敦桥</option>
        </select>
        <span id="song-detail">贝多芬 · 118 BPM · C Major</span>
      </div>
      <div class="opt-row">
        <span class="opt-label">键数</span>
        <div class="seg">
          <button class="seg-btn" data-keys="4">4K</button>
          <button class="seg-btn" data-keys="5">5K</button>
          <button class="seg-btn selected" data-keys="7">7K 完整音阶</button>
        </div>
      </div>
      <div class="opt-row">
        <label class="opt-label" for="speed-select">滚速</label>
        <select id="speed-select">
          <option value="0.5">0.50×</option><option value="0.75">0.75×</option><option value="1">1.00×</option>
          <option value="1.25" selected>1.25×</option><option value="1.5">1.50×</option><option value="1.75">1.75×</option>
          <option value="2">2.00×</option><option value="2.25">2.25×</option><option value="2.5">2.50×</option><option value="3">3.00×</option>
        </select>
        <span class="opt-hint">只改变读谱距离，不改变歌曲或判定</span>
      </div>
      <div class="diff-row">
        <button class="difficulty" data-difficulty="easy">初级 · 主旋律</button>
        <button class="difficulty selected" data-difficulty="medium">中级 · 和弦</button>
        <button class="difficulty" data-difficulty="hard">高级 · 对旋</button>
      </div>
      <button class="btn-main" id="start-btn">开始演奏</button>
    </div>
  </div>

  <div class="overlay hidden" id="paused">
    <div class="panel">
      <h1 style="font-size:30px;">暂停中</h1>
      <p class="sub">暂停期间谱面时钟已冻结，继续后无缝衔接</p>
      <div class="btn-row">
        <button class="btn-main" id="resume-btn" style="padding:10px 34px;font-size:15px;">继续</button>
        <button class="btn-sub" id="pause-menu-btn">回主菜单</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="over">
    <div class="panel">
      <p id="over-kicker" style="color:#c084fc;letter-spacing:4px;font-size:12px;margin-bottom:6px;">演出结束</p>
      <h1 id="over-title" style="font-size:32px;color:#e9d5ff;text-shadow:0 3px 16px rgba(168,85,247,.4);">再来一局？</h1>
      <div id="over-stats"></div>
      <div class="btn-row">
        <button class="btn-main" id="retry-btn" style="padding:11px 38px;font-size:16px;">再来一局</button>
        <button class="btn-sub" id="menu-btn">回主菜单</button>
      </div>
    </div>
  </div>
</div>

<script src="../shared/vocabulary.js"></script>
<script src="game.js?v=20260825d"></script>
</body>
</html>
